<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome To …</title>
<style>
  /* Every value here is set by the active theme. See THEMES in the script:
     adding a theme means adding one object, nothing else. */
  :root{
    --paper:#E6EBE2;--paper-2:#DCE3D7;--card:#F2F5EF;
    --ink:#1E2A31;--ink-soft:#56666F;--rule:#AFBBAC;--rule-soft:#C7D0C3;
    --stamp:#A93A2C;--pool:#3D7F98;--park:#4F7237;--flag:#C9A227;--plum:#7A5C86;--temp:#C97B2C;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --face-w:71px;--face-h:104px;  /* card face */
    --cardgap:12px;                /* between the two cards of a combination */
    --lot-w:59px;--lot-h:86px;     /* building lot, 5% under the card */
    --r:0px;          /* panel and card rounding */
    --rs:0px;         /* small element rounding */
    --gsw:1.7;        /* glyph stroke weight */
    --bodybg:none; --bodybgsize:auto; --bodybgpos:0 0;
    /* the sticky control bar is its own surface, so dark themes can invert it */
    --bar:#1E2A31; --barfg:#F2F5EF; --barline:rgba(242,245,239,.5);
    --stampon:#F0A99E; --warn:#F0C05A;
    --scrim:rgba(30,42,49,.6); --drop:rgba(30,42,49,.13);
    --markbg:var(--ink); --markfg:var(--card); --locked:#CDD6C8;
    --onaccent:var(--card);   /* text laid on a saturated accent fill */
    --legal:rgba(201,162,39,.22); --legal-h:rgba(201,162,39,.45);
    --legalpool:rgba(61,127,152,.24); --legalpool-h:rgba(61,127,152,.46);
  }
  *{box-sizing:border-box}
  body{margin:0;background-color:var(--paper);background-image:var(--bodybg);
    background-size:var(--bodybgsize);background-position:var(--bodybgpos);
    color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
    -webkit-text-size-adjust:100%;transition:background-color .35s ease,color .35s ease}
  #bgart{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 14px 70px}
  /* the title and the mark share the first line, the figures take the second */
  .mastline{display:flex;align-items:center;justify-content:space-between;gap:16px}
  /* Carried inline rather than linked: the page is one self-contained file, and
     the deployed site publishes only the HTML. A test keeps this copy and the
     one in assets/ from drifting apart. */
  .mastlogo{height:44px;width:auto;flex:0 0 auto}
  @media (max-width:520px){ .mastlogo{height:34px} }
  .mast{display:flex;flex-direction:column;gap:5px;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
  .mast h1{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;margin:0;line-height:1.1}
  /* the five counters to the left, the clock pushed to the right */
  .statbar{display:flex;justify-content:space-between;align-items:flex-end;
    gap:14px 22px;flex-wrap:wrap}
  .readout{display:flex;gap:18px;flex-wrap:wrap}
  .readout div{text-align:right}
  .readout .k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
  /* Each figure gets a fixed slot wide enough for the largest value it can hold,
     so the label beside it stays put as the number grows or shrinks. Tabular
     figures matter as much as the width: several theme fonts set digits at
     different widths, so even a reserved slot would shuffle without this. */
  .readout .v{display:inline-block;margin-left:11px;text-align:right;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
    font-family:var(--mono);font-size:12.5px;font-weight:700;line-height:1.1}
  /* the unit belongs to the figure, not to the label above it, so it takes the
     figure's colour rather than the label's grey */
  /* set like the caption beneath the clock, so the small type in the readout is
     all one size; only the colour marks it as part of the figure */
  /* lower case, like every other "pts" in the app: the score sheet, the plan
     values and the briefing targets all write it that way */
  .readout .unit{font-family:var(--mono);font-size:8px;letter-spacing:.08em;
    color:var(--ink);margin-left:4px}
  /* and follows the figure when a negative score turns red */
  .readout .v.bad + .unit{color:var(--stamp)}
  #rd-round{min-width:2ch}     /* 1 through 30-odd */
  #rd-deck {min-width:2ch}     /* 81 down to 0, or an em dash */
  #rd-built{min-width:5ch}     /* 0/33 through 33/33 */
  #rd-score{min-width:4ch}     /* three digits, and a minus sign early on */
  #rd-best {min-width:4ch}
  /* The clock names its own parts inline. Each figure keeps a slot of its own,
     so the labels stay put whatever the times read. */
  .readout .tl{font-family:var(--mono);font-size:8px;letter-spacing:.08em;
    color:var(--ink-soft);margin-left:10px;margin-right:4px}
  .readout .tl:first-child{margin-left:0}
  .readout .tv{display:inline-block;min-width:5ch;text-align:right}
  .readout .v.bad{color:var(--stamp)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:20px;align-items:start}
  @media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
  .panel{background:var(--card);border:1px solid var(--rule);padding:12px 13px 14px;margin-bottom:16px}
  .panel>h2{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule-soft)}

  /* construction cards: on the table these are two separate objects, a
     discard showing its effect and a stack showing the next number */
  .hand{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:640px){.hand{grid-template-columns:1fr;gap:10px}}
  /* One height for every state. Solo shows a large face and two buttons, the
     standard turn a smaller face plus a corner note and one button, and before
     the deal there are no buttons at all — left to itself the box swung by 41px
     between them and the row jumped as the sheet started or the mode changed.
     min-height rather than height so nothing can ever be clipped, with a few
     pixels over the tallest state: line heights vary a little between the theme
     fonts, and a box that grew to fit would be the one box out of step. */
  .combo{border:1px solid var(--rule-soft);background:var(--paper-2);padding:9px 9px 0;
    display:flex;flex-direction:column;min-height:216px}
  /* selection must not change the box geometry, or the card shifts by a pixel */
  .combo.chosen{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
  .combo.dim{opacity:.32}
  /* a number with nowhere legal left to go */
  .combo.numdead .bignum{color:var(--stamp);opacity:.6;text-decoration:line-through}
  .combo.numdead .face{border-color:var(--stamp);border-style:dashed}
  .combo.numdead .legend span{color:var(--stamp)}
  .combo.dead{opacity:.62}
  .combo-head{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
  .combo-body{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    gap:var(--cardgap)}
  .face{position:relative;background:var(--card);border:1px solid var(--rule);
    width:var(--face-w);height:var(--face-h);flex:0 0 auto;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  /* a stack has thickness */
  .face.stack{box-shadow:2px 2px 0 var(--card),2px 2px 0 1px var(--rule),
    4px 4px 0 var(--card),4px 4px 0 1px var(--rule)}
  /* a discarded card lies slightly askew */
  .face.discard{transform:rotate(-2.5deg);box-shadow:1px 2px 0 var(--drop)}
  .bignum{font-family:var(--mono);font-size:38px;font-weight:700;line-height:1}
  .face .corner{position:absolute;width:12px;height:12px}
  .face .corner.tl{top:3px;left:3px}
  .face .corner.br{bottom:3px;right:3px;transform:rotate(180deg)}
  .face .gl{width:38px;height:38px}
  .face .cap2{font-family:var(--mono);font-size:9px;letter-spacing:.05em;
    text-transform:uppercase;text-align:center;line-height:1.2;margin-top:5px;padding:0 3px}
  .link{font-family:var(--mono);font-size:21px;color:var(--ink-soft)}
  .legend{display:flex;align-items:flex-start;justify-content:center;
    gap:var(--cardgap);margin-top:6px}
  /* A floor rather than a fixed width. The floor keeps the standard turn's two
     labels sitting under the cards they describe; letting them grow past it stops
     the longer wordings being clipped, which they were in every theme, and the
     row is centred so growing stays symmetrical. */
  .legend span{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);min-width:var(--face-w);text-align:center;line-height:1.25;
    white-space:nowrap}
  .legend span.mid{flex:0 0 auto;min-width:0;width:13px}
  .cornernote{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--plum);text-align:center;margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* A fixed gap before the buttons, a little under the 13px it used to be. It no
     longer grows: the card area takes up whatever the box has spare, so this is
     the gap itself rather than the gap plus the slack. */
  .pgap{flex:0 0 auto;height:10px}
  .picks{display:flex;margin:0 -9px;border-top:1px dashed var(--rule)}
  .picks button{flex:1;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;background:var(--card);color:var(--ink);border:0;
    padding:8px 2px;cursor:pointer;
    /* a wrapped label would grow one box and undo the fixed height */
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picks button+button{border-left:1px dashed var(--rule)}
  .picks button:hover:not(:disabled){background:var(--ink);color:var(--card)}
  .picks button:disabled{opacity:.3;cursor:default}
  .picks button.on{background:var(--ink);color:var(--card)}
  .picks button.oneff.on{background:var(--plum)}

  /* streets */
  .street{margin-bottom:15px}
  .sh{display:flex;align-items:center;gap:9px;margin-bottom:4px;flex-wrap:wrap;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
  .sh .nm{font-weight:700}
  .track{display:flex;gap:3px;align-items:center}
  .track b{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-soft);font-weight:400}
  .bx{font-family:var(--mono);font-size:10px;min-width:19px;height:17px;line-height:15px;text-align:center;
    border:1px solid var(--rule);background:var(--card);padding:0 2px}
  .bx.out{background:var(--markbg);color:var(--markfg);border-color:var(--markbg);text-decoration:line-through}
  .bx.live{border-color:var(--park);color:var(--park);font-weight:700}
  .road{overflow-x:auto;padding-bottom:5px}
  .lots{display:flex;align-items:stretch;min-width:max-content}
  .lot{width:var(--lot-w);height:var(--lot-h);flex:0 0 auto;border:1px solid var(--rule);background:transparent;
    font:inherit;color:inherit;padding:0;position:relative;display:flex;align-items:center;
    justify-content:center;cursor:default}
  .lot .val{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
  .lot .val sub{font-size:11px;color:var(--stamp);vertical-align:baseline}
  .lot.built{background:var(--paper-2);border-color:var(--ink)}
  .lot.locked{background:repeating-linear-gradient(135deg,var(--paper-2) 0 5px,var(--locked) 5px 10px)}
  .lot.locked::before{content:"";position:absolute;left:1px;right:1px;top:3px;height:2px;background:var(--ink)}
  .lot.roundabout{background:var(--paper-2);border-color:var(--ink)}
  .lot .rnd{width:25px;height:25px;border:2px solid var(--ink);border-radius:50%;
    display:flex;align-items:center;justify-content:center}
  .lot .rnd::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink)}
  .lot.rndpick{cursor:pointer;background:rgba(122,92,134,.2);border-color:var(--plum);border-width:2px}
  .lot.rndpick:hover{background:rgba(122,92,134,.4)}
  .lot.inked{animation:ink .22s ease-out}
  @keyframes ink{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .lot .pt{position:absolute;bottom:3px;right:3px;width:16px;height:10px;border:1px solid var(--pool);border-radius:2px}
  .lot .pt.filled{background:var(--pool)}
  .lot .pt.filled::after{content:"";position:absolute;inset:-3px;border:1.5px solid var(--pool);border-radius:4px}
  .lot.legal{cursor:pointer;background:var(--legal);border-color:var(--flag);border-width:2px}
  .lot.legal:hover{background:var(--legal-h)}
  .lot.legal.pool{background:var(--legalpool);border-color:var(--pool)}
  .lot.legal.pool:hover{background:var(--legalpool-h)}
  .lot.src{cursor:pointer;box-shadow:inset 0 0 0 2px var(--stamp)}
  .lot .ghost{font-family:var(--mono);font-size:22px;font-weight:700;opacity:.5}
  .lot:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .gap{width:13px;flex:0 0 auto;background:none;border:0;padding:0;position:relative;cursor:default}
  .gap .post{position:absolute;top:4px;bottom:4px;left:50%;width:3px;transform:translateX(-50%);background:transparent}
  .gap.fenced .post{background:var(--ink)}
  .gap.pick{cursor:pointer}
  .gap.pick .post{background:repeating-linear-gradient(180deg,var(--flag) 0 4px,transparent 4px 8px)}
  .gap.pick:hover .post{background:var(--flag)}
  .edge{width:6px;flex:0 0 auto;position:relative}
  .edge::before{content:"";position:absolute;top:4px;bottom:4px;left:50%;width:3px;
    transform:translateX(-50%);background:var(--ink)}

  .stair{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;align-items:end}
  /* 17px elsewhere; a fifth taller here, where the columns are the control */
  .stair .bx{height:20px;line-height:18px}
  .stair .col .cap{padding:3px 0}
  .col{display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
  .col .cap{font-family:var(--mono);font-size:9.5px;text-align:center;font-weight:700;
    background:var(--paper-2);border:1px solid var(--rule-soft);padding:2px 0;margin-top:3px}
  .col.pick{cursor:pointer}
  .col.pick .cap{background:var(--plum);color:var(--onaccent);border-color:var(--plum)}
  .col.pick:hover .cap{background:var(--ink)}
  .col .bx{width:100%}

  .plan{border-left:3px solid var(--rule);padding:0 0 0 9px;margin-bottom:12px}
  .plan .tier{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
  .plan .txt{font-size:12.5px}
  .plan .val{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
  .plan.done{border-left-color:var(--park)}
  .plan.done .txt{text-decoration:line-through;color:var(--ink-soft)}
  .plan.done .val{color:var(--park);font-weight:700}
  .plan.approved .val{color:var(--stamp)}
  .plan .vbtn{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    background:var(--park);color:var(--onaccent);border:0;padding:4px 8px;margin-top:3px;cursor:pointer}
  .plan .vbtn:hover{background:var(--ink);color:var(--card)}

  .sheet{width:100%;border-collapse:collapse;font-size:12.5px}
  .sheet td{padding:3px 0;border-bottom:1px dotted var(--rule-soft)}
  .sheet td:last-child{text-align:right;font-family:var(--mono);font-weight:700}
  .sheet tr.neg td:last-child{color:var(--stamp)}
  .sheet tr.tot td{border-bottom:0;border-top:2px solid var(--ink);padding-top:6px;font-weight:700}
  .sheet tr.tot td:last-child{font-size:17px}
  .sheet td.sub{padding-left:9px;color:var(--ink-soft);font-size:11.5px}
  /* three weights: dotted between rows, this between bonuses and penalties,
     and the ink rule above the total */
  .sheet tr.sep td{border-top:2px solid var(--rule);padding-top:5px}
  /* a section whose variant is switched off: shown, but plainly inactive */
  .sheet tr.dim{opacity:.4}
  .trow.dim{opacity:.4}
  .sheet td.ic{width:20px;padding-right:5px;vertical-align:middle}
  .sheet td.ic svg{width:15px;height:15px;display:block}
  .tracks{display:flex;flex-direction:column;gap:8px}
  .trow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .trow .lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);width:100%}

  .status{position:sticky;bottom:0;margin-top:4px;background:var(--bar);color:var(--barfg);
    padding:10px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status .msg{flex:1 1 220px;font-size:13px}
  .status .msg b{font-family:var(--mono);letter-spacing:.06em}
  .status .warn{color:var(--warn)}
  .btn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;color:var(--barfg);border:1px solid var(--barline);padding:6px 10px;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--barfg);color:var(--bar)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
  .btn.stampish{border-color:var(--stamp);color:var(--stampon)}
  .btn.stampish:hover:not(:disabled){background:var(--stamp);color:var(--card);border-color:var(--stamp)}
  /* "off" is a character wider than "on", which shifted every button to its
     right when a toggle flipped. Reserve the wider state's width for both. */
  .tgl{display:inline-block;min-width:4.2ch;text-align:center}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--flag);color:var(--ink);
    border:0;padding:5px 9px;cursor:pointer}
  .chip:hover{background:var(--card)}
  .chip.ghosty{background:transparent;color:var(--barfg);border:1px solid var(--barline);font-weight:400}
  .chip.ghosty:hover{background:var(--barfg);color:var(--bar)}

  .scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;
    justify-content:center;padding:16px;z-index:40}
  .scrim[hidden]{display:none}
  .modal{background:var(--card);border:2px solid var(--ink);max-width:640px;width:100%;
    max-height:88vh;overflow-y:auto;padding:20px}
  .modal.wide{max-width:960px}
  .modal.mid{max-width:750px}
  .modal h3{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 4px}
  .modal .lede{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px}
  .modal .btn{color:var(--ink);border-color:var(--ink)}
  .modal .btn:hover{background:var(--ink);color:var(--card)}
  .modal .btn.on{background:var(--ink);color:var(--card)}
  .modal h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule-soft)}
  /* One fixed column width everywhere, so a box is the same size whichever
     section it sits in. Fractional columns made them stretch to fill the row,
     which left the six estate fields much wider than the rest. */
  .fieldgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .fieldgrid.wide{grid-template-columns:1fr}
  @media (max-width:620px){
    .fieldgrid{grid-template-columns:1fr}
  }
  /* a subsection inside a settings group, styled like the plan categories */
  /* Streets are separated rather than bracketed: a section heading uses a solid
     rule, so a dotted one of the same colour reads a step lighter. No line above
     the first, and no left bar or indent. */
  .substack{margin-bottom:12px}
  .substack + .substack{border-top:1px dotted var(--rule-soft);padding-top:12px}
  .subh{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);display:block;margin-bottom:5px}
  .fieldgrid label{font-size:11px;display:block}
  .fieldgrid .lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);display:block}
  .fieldgrid input{width:100%;font-family:var(--mono);font-size:12px;padding:4px 6px;
    border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
  .verdict{font-family:var(--mono);font-size:30px;font-weight:700;margin:6px 0 2px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .note{font-size:11.5px;color:var(--ink-soft)}
  .note code{font-family:var(--mono);font-size:11px}
  /* theme-driven rounding */
  .panel,.modal,.combo{border-radius:var(--r)}
  .face,.lot{border-radius:var(--rs)}
  .bx,.col .cap{border-radius:calc(var(--rs)*.45)}
  .btn,.chip,.picks button,.vbtn{border-radius:calc(var(--rs)*.7)}
  .status{border-radius:var(--r) var(--r) 0 0}
  #mark{display:inline-block;vertical-align:-5px;margin-right:8px}
  #mark svg{width:25px;height:25px}
  /* live miniature of the theme: custom properties are set inline on .tprev,
     so everything inside resolves to that theme without switching the app */
  .tprev{margin-top:8px;padding:9px;border:1px solid var(--rule);
    background-color:var(--paper);background-image:var(--bodybg);
    background-size:var(--bodybgsize);background-position:var(--bodybgpos);
    border-radius:var(--rs)}
  .tprev-in{display:flex;align-items:center;gap:10px}
  .tp-card{width:34px;height:47px;flex:0 0 auto;border:1px solid var(--rule);background:var(--card);
    border-radius:var(--rs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .tp-n{font-family:var(--mono);font-weight:700;font-size:16px;line-height:1;color:var(--ink)}
  .tp-g{width:13px;height:13px}
  .tp-street{display:flex;align-items:center;gap:2px}

  .tp-street i.on{background:var(--paper-2);border-color:var(--ink)}
  .tp-street b{width:3px;height:21px;background:var(--ink);border-radius:2px}
  .tp-set{display:flex;gap:6px;margin-left:auto}
  .tp-s{width:17px;height:17px}
  .themegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  @media (max-width:560px){.themegrid{grid-template-columns:1fr}}
  .themecard{text-align:left;display:block;width:100%;background:var(--paper-2);
    border:1px solid var(--rule);padding:9px 11px 11px;cursor:pointer;
    font:inherit;color:inherit;border-radius:var(--rs)}
  .themecard:hover{border-color:var(--ink)}
  .themecard.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
  .themecard b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .themecard span{display:block;font-size:11.5px;color:var(--ink-soft)}

  /* clock: three readings in one readout cell */

  /* hint statistics */
  .hint[hidden]{display:none}
  .hrow{margin-bottom:11px}
  .hrow:last-child{margin-bottom:0}
  .hcap{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:5px}
  .hcap em{font-style:normal;color:var(--ink);font-weight:700}

  .hlbl{font-family:var(--mono);font-size:10px;font-weight:700;line-height:1}
  .hpct{font-family:var(--mono);font-size:8px;color:var(--ink-soft);line-height:1}
  .hcell.zero .hlbl,.hcell.zero .hpct{opacity:.4}
  .heff{display:flex;gap:7px;flex-wrap:wrap}
  .heffcell{flex:1 1 96px;display:flex;align-items:center;gap:6px;
    background:var(--paper-2);border:1px solid var(--rule-soft);padding:5px 7px;
    border-radius:calc(var(--rs)*.6)}
  .heffcell svg{width:17px;height:17px;flex:0 0 auto}
  .heffcell .en{font-family:var(--mono);font-size:9px;letter-spacing:.06em;line-height:1.2}
  .heffcell .ep{font-family:var(--mono);font-size:12px;font-weight:700;margin-left:auto}

  /* pre-game briefing */
  .brief{width:100%;border-collapse:collapse;font-size:12.5px}
  .brief td{padding:4px 0;border-bottom:1px dotted var(--rule-soft);vertical-align:top}
  .brief tr:last-child td{border-bottom:0}
  .brief td:first-child{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-soft);width:92px;padding-top:6px}
  .brief.plans td:first-child{width:46px}
  .brief.plans td:last-child{text-align:right;font-family:var(--mono);font-weight:700;
    white-space:nowrap;width:1px;padding-left:12px}
  .modal .btn.primary{background:var(--ink);color:var(--card)}
  .modal .btn.primary:hover{background:var(--stamp);border-color:var(--stamp);color:var(--card)}

  /* plan chooser */
  /* the list follows a toolbar, which only carries a top margin */
  .planlist{display:flex;flex-direction:column;gap:13px;margin-top:15px}
  .pitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

  .pgroup{border-left:3px solid var(--rule);padding-left:9px}

    color:var(--ink-soft);display:block;margin-bottom:5px}
  .ptog{position:relative;overflow:hidden;display:flex;width:100%;align-items:baseline;gap:8px;
    text-align:left;font:inherit;color:inherit;background:transparent;
    border:1px solid var(--rule-soft);padding:6px 17px 6px 9px;
    cursor:pointer;font-size:12px;border-radius:calc(var(--rs)*.6)}
  .ptog:hover{border-color:var(--ink)}
  .ptog .tick{font-family:var(--mono);font-size:11px;width:12px;flex:0 0 auto;font-weight:700}
  .ptog.on .tick::before{content:"\2713"}
  .ptog.off .tick::before{content:"\00b7"}
  .ptog.off{opacity:.44}
  /* needs a variant that is currently off: shown, but plainly not in the pool */
  .ptog.unavail{opacity:.5;cursor:default;
    background:repeating-linear-gradient(135deg,
      transparent 0 6px,var(--rule-soft) 6px 7px,transparent 7px 13px)}
  .ptog.unavail:hover{border-color:var(--rule-soft)}
  .ptog.unavail .tick::before{content:"\2013"}
  .ptog em{font-style:normal;font-family:var(--mono);font-size:10px;margin-left:auto;
    white-space:nowrap;color:var(--ink-soft)}
  .ptog .star{color:var(--flag)}
  /* the same circle-and-dot the board uses, at label size */
  .rndmark{display:inline-block;width:10px;height:10px;margin-left:5px;position:relative;
    border:1.5px solid var(--ink);border-radius:50%;vertical-align:-1px}
  .rndmark::after{content:"";position:absolute;top:50%;left:50%;width:3px;height:3px;
    margin:-1.5px 0 0 -1.5px;border-radius:50%;background:var(--ink)}
  /* the three drawn for this sheet get a folded corner. The 50% line of a 225deg

  .ptog.drawn{background:var(--paper-2);border-color:var(--ink)}

    background:linear-gradient(225deg,var(--park) 0 47%,var(--card) 47% 53%,transparent 53%)}
  /* the last plan left on in a category cannot be switched off, so it should

  .ptog.fixed{cursor:default}
  .ptog.fixed:hover{border-color:var(--rule-soft)}
  .ptog.fixed.drawn:hover{border-color:var(--ink)}

  /* the sheet's city name, written into the title the way the printed sheet does */
  #cityslot{display:inline-block}
  .cityname{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink-soft);
    background:transparent;border:0;border-bottom:2px dotted var(--rule);
    padding:0 3px 1px;cursor:pointer;line-height:inherit}
  .cityname:hover,.cityname:focus-visible{color:var(--ink);border-bottom-color:var(--ink)}
  .cityname.empty{letter-spacing:.2em}
  .cityinput{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink);
    background:transparent;border:0;border-bottom:2px solid var(--ink);
    /* fifteen characters is the cap, and at this size they need about 225px */
    padding:0 3px 1px;width:min(350px,44vw)}
  .cityinput:focus{outline:none}
  /* the game's title, overarching the dialog's own heading */
  .modal .gametitle{font-family:var(--mono);font-size:22px;font-weight:700;
    letter-spacing:.11em;text-transform:uppercase;line-height:1.15;
    margin:0 0 13px;padding-bottom:11px;border-bottom:2px solid var(--ink)}
  /* the briefing sets the title larger, so the same fifteen characters need

  .modal .gametitle .cityinput{width:min(248px,50vw)}
  @media (max-width:520px){
    .modal .gametitle{font-size:16px;letter-spacing:.08em}

  /* sheet seed */
  .seedname{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.11em;
    background:transparent;color:var(--ink);border:0;border-bottom:1px dotted var(--rule);
    padding:0 2px 1px;cursor:pointer}

  .seedinput{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.11em;
    background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--ink);

  .seedinput:focus{outline:none}
  .seedroll{font-family:var(--mono);font-size:13px;line-height:1;background:transparent;
    color:var(--ink-soft);border:1px solid var(--rule);border-radius:calc(var(--rs)*.5);
    padding:1px 5px 2px;margin-left:7px;cursor:pointer}
  .seedroll:hover{background:var(--ink);color:var(--card);border-color:var(--ink)}

    color:var(--ink-soft);margin-left:8px}
  /* the code carries its own white quiet zone, and the frame keeps it white on
     the dark themes too */
  .qrbox{display:flex;justify-content:center;margin:15px 0}
  /* the quiet zone comes from the image's own margin; the frame just picks up
     the code's own background so the two do not meet in a hard edge */
  .qrwrap{padding:6px;border:1px solid var(--rule);
    border-radius:calc(var(--rs)*.5);line-height:0}
  .qrwrap canvas,.qrwrap img,.qrwrap table{display:block}
  .qrnone{font-size:12.5px;color:var(--ink-soft);text-align:center;max-width:320px}

  /* multiplayer room */
  .rfield{margin-bottom:10px}
  .rfield label{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:3px}
  .rfield input{width:100%;font-family:var(--mono);font-size:12px;padding:5px 7px;

  .rstatus{font-size:12.5px;padding:7px 9px;border-left:3px solid var(--rule);
    background:var(--paper-2);margin:12px 0;border-radius:0 calc(var(--rs)*.5) calc(var(--rs)*.5) 0}
  .rstatus.live{border-left-color:var(--park)}
  .rstatus.bad{border-left-color:var(--stamp);color:var(--stamp)}
  .roster{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .pl{display:flex;align-items:baseline;gap:7px;border:1px solid var(--rule-soft);

  .pl .badge{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;

  .pl .badge.host{background:var(--plum)}
  .pl .rdy{margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;

  return Object.assign({}, BASE_GPATH, (THEMES[id] && THEMES[id].glyphs) || {});

function glyphIn(set, e, cls){
  return '<svg class="'+cls+'" viewBox="0 0 24 24" fill="none" stroke="'+GCOLOR[e]+
    '" stroke-width="var(--gsw)" stroke-linecap="round" stroke-linejoin="round">'+set[e]+'</svg>';
}

/* a deterministic starfield, tiled so it never stretches */
function starfield(){
  let seed=7, stars="";
  const rnd=()=>((seed=seed*16807%2147483647)/2147483647);
  for(let i=0;i<95;i++)
    stars+='<circle cx="'+(rnd()*300).toFixed(1)+'" cy="'+(rnd()*300).toFixed(1)+
      '" r="'+(rnd()*1.05+0.3).toFixed(2)+'" fill="var(--ink)" opacity="'+
      (rnd()*0.5+0.14).toFixed(2)+'"/>';
  return '<svg width="100%" height="100%"><defs>'+
    '<pattern id="stars" width="300" height="300" patternUnits="userSpaceOnUse">'+stars+
    '</pattern></defs><rect width="100%" height="100%" fill="url(#stars)"/></svg>';
}
/* irregular blotching, for vellum */
function mottle(){
  let seed=23, blobs="";
  const rnd=()=>((seed=seed*16807%2147483647)/2147483647);
  for(let i=0;i<26;i++)
    blobs+='<ellipse cx="'+(rnd()*260).toFixed(1)+'" cy="'+(rnd()*260).toFixed(1)+
      '" rx="'+(rnd()*26+9).toFixed(1)+'" ry="'+(rnd()*20+7).toFixed(1)+
      '" fill="var(--ink)" opacity="'+(rnd()*0.030+0.012).toFixed(3)+'"/>';
  return '<svg width="100%" height="100%"><defs>'+
    '<pattern id="vellum" width="260" height="260" patternUnits="userSpaceOnUse">'+blobs+
    '</pattern></defs><rect width="100%" height="100%" fill="url(#vellum)"/></svg>';
}

const THEME_ORDER = ["drafting","hillside","cats","orbit","scriptorium","riso"];

function applyTheme(id){
  const t = THEMES[id] || THEMES.drafting;
  const root = document.documentElement;
  /* clear anything a previous theme set, then apply */
  THEME_ORDER.forEach(k=>Object.keys(THEMES[k].vars).forEach(v=>root.style.removeProperty(v)));
  Object.keys(t.vars).forEach(v=>root.style.setProperty(v, t.vars[v]));
  GPATH = Object.assign({}, BASE_GPATH, t.glyphs||{});
  const css=document.getElementById("themecss"); if(css) css.textContent = t.css || "";
  const art=document.getElementById("bgart"); if(art) art.innerHTML = t.bgart || "";
  const mk=document.getElementById("mark");
  if(mk) mk.innerHTML = t.mark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.7" '+
      'stroke-linecap="round" stroke-linejoin="round">'+t.mark+'</svg>' : "";
}

/* A miniature of the real interface. Custom properties are set inline on the
   wrapper, so the whole subtree renders in that theme without activating it. */
function themePreview(id){
  const t=THEMES[id], set=glyphSet(id);
  const vars = "--bodybgsize:auto;--bodybgpos:0 0;--gsw:1.7;" +
    Object.keys(t.vars).map(k=>k+":"+t.vars[k]).join(";");
  return '<div class="tprev" style="'+vars.replace(/"/g,"&quot;")+'">'+
    '<div class="tprev-in">'+
      '<div class="tp-card"><span class="tp-n">8</span>'+glyphIn(set,"landscaper","tp-g")+'</div>'+
      '<div class="tp-street"><i class="on">3</i><i></i><b></b><i class="on">7</i><i></i></div>'+
      '<div class="tp-set">'+glyphIn(set,"pool","tp-s")+glyphIn(set,"temp","tp-s")+
        glyphIn(set,"bis","tp-s")+'</div>'+
    '</div></div>';
}

function themePicker(){
  let h='<h3>Theme</h3><p class="lede">Visual only \u2014 the rules, values and deck never change.</p>'+
        '<div class="themegrid">';
  THEME_ORDER.forEach(id=>{
    const t=THEMES[id];
    h+='<button class="themecard'+(CFG.theme===id?" on":"")+'" data-theme="'+id+'">'+
       '<b>'+t.name+'</b><span>'+t.blurb+'</span>'+themePreview(id)+'</button>';
  });
  h+='</div><div class="toolbar"><button class="btn" onclick="backOut()">Close</button></div>';
  openBox(h);
  document.getElementById("modal").querySelectorAll("button[data-theme]").forEach(b=>{
    b.onclick=()=>{ CFG.theme=b.dataset.theme; applyTheme(CFG.theme); save(); themePicker(); render(); };
  });
}
function glyph(e, cls){
  return '<svg class="'+cls+'" viewBox="0 0 24 24" fill="none" stroke="'+GCOLOR[e]+
    '" stroke-width="var(--gsw)" stroke-linecap="round" stroke-linejoin="round">'+
    GPATH[e]+'</svg>';
}

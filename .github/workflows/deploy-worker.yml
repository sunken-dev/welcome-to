name: 🚀 Deploy Cloudflare Worker

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_WORKER_API_TOKEN:
        required: true
      CLOUDFLARE_WORKER_ACCOUNT_ID:
        required: true
      CLOUDFLARE_WORKER_NAME:
        required: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_WORKER_ACCOUNT_ID }}
          command: deploy worker.js --name ${{ secrets.CLOUDFLARE_WORKER_NAME }} --compatibility-date 2024-01-01
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_WORKER_ACCOUNT_ID }}
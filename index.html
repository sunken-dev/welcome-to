function bisAt(si,i){ return bisTargets().find(t=>t.si===si&&t.i===i); }

/* Fences: any free dotted space, but not splitting a duplicate pair (p7) and
   not splitting an estate already used for a City Plan (p8). */
function fenceOK(si,gi){
  const st=G.streets[si];
  if(st.fences[gi]) return false;
  const a=st.slots[gi], b=st.slots[gi+1];
  if(a.v!==null && b.v!==null && a.v===b.v) return false;
  if(a.locked && b.locked) return false;
  return true;
}

/* --------------------------------------------------------- scoring (p8) */
/* Construction cards still to come, whichever way they were dealt. The Solo card
   is not one of them: it is an event shuffled into the deck, and the hints panel
   already counts without it, so counting it here would put the two readouts one
   apart on the same screen. */
function cardsLeft(){
  if(CFG.mode==="solo") return (G.deck||[]).filter(c=>c&&!c.solo).length;
  return (G.stacks||[]).reduce((a,st)=>a+st.length,0);
}

function tempPoints(){
  if(!MP.on) return G.temp>=CFG.soloTempMin ? CFG.soloTempPts : 0;
  if(!mpFinalsIn()) return 0;            /* cannot be ranked until everyone reports */
  return positionalTemp(G.temp, mpTempCounts());
}
function score(){
  const rows=[]; let total=0;
  rows.push(["Achievements",null,false,"achievements",false,false,true]);
  /* Broken down the same way the estates are: a total, then a line per part.
     Each set of parts sums to the row above it, which the tests check. */
  let pl=0; const perPlan=[];
  G.plans.slice().sort((a,b)=>a.n-b.n).forEach(p=>{
    const v=p.done?p.scored:0;
    pl+=v;
    perPlan.push(["Plan n\u00b0"+p.n+(p.done?"":" (open)"),v,true,null]);
  });
  rows.push(["City plans",pl,false,"plan"]); total+=pl;
  perPlan.forEach(r=>rows.push(r));

  let pk=0; const perPark=[];
  G.streets.forEach((st,i)=>{
    const ladder=CFG.streets[i].parks;
    const v=ladder[Math.min(st.parks,ladder.length-1)];
    pk+=v;
    perPark.push(["Street "+(i+1)+" ("+st.parks+" of "+(ladder.length-1)+")",v,true,null]);
  });
  rows.push(["Parks",pk,false,"landscaper"]); total+=pk;
  perPark.forEach(r=>rows.push(r));

  /* Unlike the parks, the pools share one ladder across all three streets: the
     score depends on how many are built in total, not on where they are. So the
     per-street lines below are a division of that one figure, walking the ladder
     street by street. They add up to the same total, and the count in each label
     is exact; only the split of the points is a convention. */
  const po=CFG.pool[Math.min(G.pools,CFG.pool.length-1)];
  const perPool=[]; let walked=0;
  G.streets.forEach((st,i)=>{
    const have=st.slots.filter(x=>x.pool).length;
    const can=st.slots.filter(x=>x.isPool).length;
    const from=CFG.pool[Math.min(walked,CFG.pool.length-1)];
    walked+=have;
    const to=CFG.pool[Math.min(walked,CFG.pool.length-1)];
    perPool.push(["Street "+(i+1)+" ("+have+" of "+can+")",to-from,true,null]);
  });
  rows.push(["Pools",po,false,"pool"]); total+=po;
  perPool.forEach(r=>rows.push(r));

  const tw=tempPoints();
  rows.push([MP.on&&!mpFinalsIn()?"Temp agency (ranked at the end)":"Temp agency",tw,false,"temp"]);
  total+=tw;

  const es=estates(); let et=0;
  const perSize=[];
  for(let n=1;n<=6;n++){
    const v=estateValue(n);
    const c=es.filter(e=>e.size===n).length;
    et+=v*c;
    perSize.push(["Estates of "+n+" ("+c+" \u00d7 "+v+")",v*c,true,null]);
  }
  rows.push(["Completed housing estates",et,false,"agent"]); total+=et;
  perSize.forEach(r=>rows.push(r));          /* nested under their own total */

  /* a heading and a gap here rather than a rule across the sheet */
  rows.push(["Penalties",null,false,"penalties",true,false,true]);
  const bi=-CFG.bis[Math.min(G.bisCount,CFG.bis.length-1)];
  rows.push(["Bis",bi,false,"bis"]);
  total+=bi;

  /* Kept in the list even when the variant is off, dimmed rather than removed,
     so the sheet does not change shape. With none built it is worth nothing. */
  const rd=-CFG.roundaboutValues[Math.min(G.rounds,CFG.roundaboutValues.length-1)];
  rows.push(["Roundabouts",rd,false,"roundabout",false,!CFG.roundabouts]);
  total+=rd;

  const rf=-CFG.refusal[Math.min(G.refusals,CFG.refusal.length-1)];
  rows.push(["Building permit refusal",rf,false,"refusal"]); total+=rf;
  return {rows:rows,total:total};
}

/* --------------------------------------------------------- city plans */
function matchPlan(p){
  if(p.sp) return SPECIAL[p.sp](p) ? [] : null;
  const free=estates().filter(e=>!e.locked), used=[];
  for(const need of p.req){
    const k=free.findIndex(e=>e.size===need);
    if(k===-1) return null;
    used.push(free[k]); free.splice(k,1);
  }
  return used;
}
function validatePlan(pi){
  if(locked()) return;
  const p=G.plans[pi];
  if(p.done) return;
  const m=matchPlan(p);
  if(!m) return;
  keep();
  /* Which plan spent them, not merely that they are spent: with three plans in
     play it matters which run paid for which, and it lets the sheet draw each
     locked run as one unit rather than a row of hatched houses. */
  m.forEach(e=>e.idx.forEach(i=>{
    const slot=G.streets[e.si].slots[i];
    slot.locked=true; slot.lockedBy=p.n;
  }));
  if(!replaying) pendingPlans.push(p.id);
  p.done=true;
  if(MP.on){
    /* p8: whoever gets there first in a round takes the higher amount, and so
       does anyone matching them that same round. Later rounds take the lower. */
    const beaten=MP.claims.some(c=>c.planId===p.id && c.round<G.round);
    p.scored = beaten ? p.lo : p.hi;
    MP.claims.push({planId:p.id, round:G.round, by:MP.me});
    mpSend({t:"plan", planId:p.id, round:G.round});
  } else {
    p.scored = G.approved ? p.lo : p.hi;
  }
  if(checkEnd()) return;
  render();
}

/* --------------------------------------------------------- the round */
/* ------------------------------------------------- taking a round back
   A round is stored as the decisions that made it, not as a copy of the board: the deck
   comes from the seed, so replaying those decisions from a fresh deal reproduces the
   board exactly. Taking a round back means dealing again and replaying one fewer.

   That is only as sound as the turn logic is deterministic, so every entry carries a
   fingerprint of the board it produced. After a replay the fingerprints are checked; if
   one disagrees the board would be one that never existed, and the undo is refused rather
   than quietly handing over a lie. */
/* The stops the slider offers, and the only values a link may carry. */
const UNDO_STOPS=[0,1,3,5,7,10];
const UNDO_ALL="all";
/* the stops in the order the slider offers them */
function undoStops(){ return UNDO_STOPS.concat([UNDO_ALL]); }
function undoIndex(v){
  const i=undoStops().indexOf(v);
  return i<0 ? undoStops().indexOf(BASE.undo) : i;
}
function undoLabel(v){
  if(v===UNDO_ALL) return "everything";
  if(!v) return "off";
  return v+" round"+(v===1?"":"s");
}
/* what the slider says, in full, since it stands on its own beside the handle */
function undoSentence(v){
  if(v===UNDO_ALL) return "all rounds can be taken back";
  if(!v) return "no round can be taken back";
  return v+" round"+(v===1?"":"s")+" can be taken back";
}
let replaying=false;          /* suppresses drawing, saving and the briefing */
let turnLog=null;             /* the decisions of the round being played */
/* A roundabout and a validated plan are free actions: neither closes a round, so both
   wait here and are written into the round they were played during. */
let pendingPlans=[], pendingRound=null;
/* The fingerprint a replay produced. Taken by logRound itself, so the original and the
   replay are measured at exactly the same point in the turn rather than at two moments I
   have reasoned are equivalent: the round counter, the game being over and the clock all
   move within a few lines of each other as a round closes. */
let replayPrint=null;

/* Short digest of the board. Not a security hash, just something that changes when the
   board does. */
function fingerprint(g){
  const flat=JSON.stringify([
    g.round, g.pools, g.temp, g.bisCount, g.refusals, g.rounds, g.over, g.approved,
    g.improve,
    g.streets.map(st=>[st.parks, st.fences.map(f=>f?1:0),
      st.slots.map(x=>[x.v, x.bis?1:0, x.round?1:0, x.pool?1:0, x.locked?1:0])]),
    g.plans.map(p=>[p.id, p.done?1:0, p.scored])
  ]);
  let a=0x811c9dc5;
  for(let i=0;i<flat.length;i++){
    a^=flat.charCodeAt(i);
    a=(a*0x01000193)>>>0;
  }
  return ("0000000"+a.toString(16)).slice(-8);
}

function historyOf(g){
  if(!g.history) g.history={at:0, rounds:[]};
  return g.history;
}
/* how far back this sheet allows going */
function undoDepth(){
  const u=CFG.undo;
  if(u==="all") return Infinity;
  return Math.max(0, u|0);
}
function undoAvailable(){
  if(!G || !G.started) return 0;
  const h=historyOf(G);
  return Math.min(h.at, undoDepth());
}
function redoAvailable(){
  if(!G || !G.started) return 0;
  const h=historyOf(G);
  return Math.max(0, h.rounds.length - h.at);
}

/* Called as each round closes. Whatever the round did not involve is left out. */
function logRound(entry){
  if(replaying){ replayPrint=fingerprint(G); return; }
  if(!G || !G.started) return;
  const h=historyOf(G);
  /* playing on after taking rounds back throws away what was ahead */
  if(h.at<h.rounds.length) h.rounds.length=h.at;
  const now=clockOut();
  const e=Object.assign({}, entry);
  if(pendingPlans.length){ e.planValidated=pendingPlans[0]; pendingPlans=[]; }
  if(pendingRound){ e.roundabout=pendingRound; pendingRound=null; }
  /* the time in the round just closed, taken from the clock rather than from the list of
     round times, which is not written until the next round begins */
  e.ms=Math.max(0,(now.inRound||0)|0);
  e.clockAt=Math.max(0,(now.total||0)-e.ms);
  e.fingerprint=fingerprint(G);
  h.rounds.push(e);
  h.at=h.rounds.length;
}

/* Replay the decisions of one round through the game's own functions, which is what makes
   the result trustworthy: nothing here reimplements a rule. */
function applyRound(r){
  /* a roundabout was played during this round, before the card was taken */
  if(r.roundabout){ sel={phase:"roundabout"}; doRoundabout(r.roundabout[0], r.roundabout[1]); }
  if(r.refusal){ refuse(); return; }
  if(CFG.mode==="solo"){
    chooseNumber(r.cardTaken);
    if(r.effectCardTaken!==undefined && r.effectCardTaken!==null) chooseEffect(r.effectCardTaken);
    else takeNoEffect();
  } else {
    takeCombination(r.cardTaken);
  }
  if(sel && sel.phase==="temp"){
    if(r.tempShift!==undefined) setTemp(r.tempShift); else declineTemp();
  }
  if(sel && sel.phase==="place" && r.house) place(r.house[0], r.house[1]);
  if(sel) switch(sel.phase){
    case "pool":  doPool(!!r.poolBuilt); break;
    case "park":  doPark(!!r.parkCrossed); break;
    case "fence": r.fence ? doFence(r.fence[0], r.fence[1]) : skipEffect(); break;
    case "agent": r.estateColumn ? doAgent(r.estateColumn) : skipEffect(); break;
    case "bis":   r.bis ? doBis(r.bis[0], r.bis[1], bisValueAt(r.bis[0], r.bis[1])) : skipEffect(); break;
  }
  if(r.planValidated){
    const pi=G.plans.findIndex(p=>p.id===r.planValidated);
    if(pi>=0) validatePlan(pi);
  }
  if(sel && sel.phase==="ready") confirmTurn();
  else if(sel) sel=null;
}
/* the number a bis at this spot copies, taken from the board rather than stored */
function bisValueAt(si,i){
  const t=bisTargets().find(x=>x.si===si && x.i===i);
  return t ? t.vals[0] : null;
}

/* Deal again and replay the first n rounds. Returns an error to report rather than
   throwing, so the caller can refuse the undo and leave the sheet alone. */
function replayTo(n){
  const log=historyOf(G);
  const rounds=log.rounds.slice();
  const keepCfg=CFG;
  replaying=true;
  try{
    newGame();
    startGame();
    G.history={at:0, rounds:rounds};
    for(let i=0;i<n;i++){
      replayPrint=null;
      applyRound(rounds[i]);
      G.history.at=i+1;
      const want=rounds[i].fingerprint;
      if(want && replayPrint && replayPrint!==want)
        return {error:"mismatch", round:i+1, want:want, got:replayPrint};
      if(want && !replayPrint)
        return {error:"no round closed", round:i+1, want:want};
    }
    return {ok:true};
  }catch(e){
    return {error:"threw", round:n, message:String(e&&e.message||e)};
  } finally {
    replaying=false;
    CFG=keepCfg;
  }
}

/* The clock as it stood after n rounds. Rolled back from what each round recorded rather
   than by summing the round times, which would lose the pauses between rounds and hand
   back a sheet that looks quicker than it was. */
function clockToStep(n){
  const done=historyOf(G).rounds.slice(0,n);
  const last=done[done.length-1];
  clockIn({
    total: last ? (last.clockAt||0)+(last.ms||0) : 0,
    rounds: done.map(x=>x.ms|0),
    stopped: !!G.over,
    running: true,
    inRound: 0
  });
}

/* Move the board to a position in the log. Deals again and replays, so nothing here
   reimplements a rule. Returns null on success, or what went wrong. */
function goToStep(n){
  const h=historyOf(G);
  if(n<0 || n>h.rounds.length) return {error:"out of range"};
  /* Replaying deals a fresh board before it can discover a disagreement, so the sheet has
     already been replaced by the time one is found. Keep it and put it back: the panel
     tells the player their sheet is untouched, and that has to be true. */
  const before={game:copy(G), sel:sel, snap:snap, clock:clockOut()};
  const res=replayTo(n);
  if(res && res.error){
    G=before.game; sel=before.sel; snap=before.snap;
    clockIn(before.clock);
    render();
    return res;
  }
  historyOf(G).at=n;
  clockToStep(n);
  sel=null; snap=null; turnLog=null;
  pendingPlans=[]; pendingRound=null;
  lastWritten=null;               /* the sheet changed shape, so it is worth writing */
  render();
  return null;
}

function undoRound(){
  if(!G || !G.started) return;
  if(sel) return;                 /* a turn is open: the way out of that is another card */
  if(!undoAvailable()) return;
  const to=historyOf(G).at-1;
  const bad=goToStep(to);
  if(bad) reportReplay(bad, to);
}
function redoRound(){
  if(!G || !G.started) return;
  if(sel) return;
  if(!redoAvailable()) return;
  const to=historyOf(G).at+1;
  const bad=goToStep(to);
  if(bad) reportReplay(bad, to);
}

/* This should never happen: the board a replay produces is checked against the fingerprint
   the round recorded, and they have never disagreed in testing. If they ever do, the sheet
   is left exactly as it was and the whole thing is offered for reporting rather than
   quietly handing over a board that never existed. */
function reportReplay(bad, wanted){
  const dump={
    complaint:"replay did not reproduce the board",
    detail:bad,
    wantedStep:wanted,
    version:BASE.dataVersion,
    settings:CFG,
    history:historyOf(G),
    board:G
  };
  const text=JSON.stringify(dump,null,2);
  openBox('<h3>Something went wrong</h3>'+
    '<p class="lede">That round could not be taken back. The sheet has been left exactly '+
    'as it was, so you can carry on playing.</p>'+
    '<p class="note">This is not supposed to happen. Sending the report below to the '+
    'developer is what lets it be found and fixed.</p>'+
    '<table class="brief">'+
      '<tr><td>Round</td><td>'+esc(String(wanted))+'</td></tr>'+
      '<tr><td>What happened</td><td>'+esc(String(bad.error||"unknown"))+'</td></tr>'+
      (bad.want?'<tr><td>Expected</td><td>'+esc(bad.want)+'</td></tr>':'')+
      (bad.got?'<tr><td>Got</td><td>'+esc(bad.got)+'</td></tr>':'')+
    '</table>'+
    '<textarea id="rp-text" class="rp-dump" readonly rows="10">'+esc(text)+'</textarea>'+
    '<div class="toolbar">'+
    '<button class="btn primary" id="rp-copy">Copy the report</button>'+
    '<button class="btn" onclick="forceCloseBox()">Carry on playing</button>'+
    '</div>', false, "mid");
  $("rp-copy").onclick=()=>{
    const box=$("rp-text");
    if(box && typeof box.select==="function") box.select();
    if(navigator && navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text);
    $("rp-copy").textContent="Copied";
  };
}

function keep(){ snap={G:copy(G)}; }

/* No move is legal before the sheet begins or after it closes. The buttons are
   disabled too, but the guard belongs here rather than only in the view. */
function locked(){ return !G || !G.started || G.over || mpIAmWaiting(); }

/* Solo: taking a card for its number opens the overlay on it, and the effect is
   then chosen from the other two inside that overlay. */
function chooseNumber(i){
  if(locked()) return;
  if(sel && sel.phase!=="choose") return;
  if(!sel){ keep(); turnLog={}; sel={numCard:null, effCard:null, phase:"choose", n:null, usedEffect:false}; }
  if(turnLog) turnLog.cardTaken=i;
  sel.numCard=i;
  if(sel.effCard===sel.numCard) sel.effCard=null;
  render();
}
/* p9: the effect must come from a different card than the number. Taking one
   commits the turn — there is nothing left to decide at that point. */
function chooseEffect(i){
  if(locked()||!sel||sel.phase!=="choose") return;
  if(sel.numCard===null || sel.numCard===i) return;
  sel.effCard=i;
  if(turnLog) turnLog.effectCardTaken=i;
  confirmChoice();
}
function takeNoEffect(){
  if(locked()||!sel||sel.numCard===null) return;
  sel.effCard=null;
  confirmChoice();
}
function takeCombination(i){
  if(locked()||(sel&&sel.phase!=="choose")) return;
  keep();                              /* so backing out undoes the whole turn */
  turnLog={cardTaken:i};
  sel={numCard:i, effCard:i, phase:"choose", n:null, usedEffect:false};
  confirmChoice();
}
function cards(){ return CFG.mode==="solo" ? G.hand : G.shown.filter(x=>x!==null); }
function cardAt(i){ return CFG.mode==="solo" ? G.hand[i] : G.shown[i]; }

/* A turn now runs inside an overlay on the card it belongs to, and nothing is
   final until it is confirmed. Every effect therefore ends by asking for that
   confirmation instead of closing the round itself, which is what made the six
   effects feel like six different flows. */
function awaitConfirm(){ if(sel) sel.phase="ready"; render(); }
function turnReady(){ return !!(sel && sel.phase==="ready"); }
function confirmTurn(){
  if(locked()||!turnReady()) return;
  endRound();
}
/* Back to the three cards, with everything this turn did undone. */
function backOutTurn(){
  if(locked()||!sel||sel.phase==="roundabout") return;
  if(snap){ G=copy(snap.G); snap=null; }
  sel=null; render();
}
function confirmChoice(){
  if(!sel || sel.numCard===null) return;
  sel.n = cardAt(sel.numCard).n;
  sel.eff = sel.effCard===null ? null : cardAt(sel.effCard).e;
  sel.phase = (sel.eff==="temp") ? "temp" : "place";
  render();
}
function setTemp(d){
  const n=cardAt(sel.numCard).n+d;
  if(n<CFG.numMin||n>CFG.numMax) return;
  if(turnLog) turnLog.tempShift=d;
  sel.n=n; sel.usedEffect=true; sel.phase="place"; render();
}
function declineTemp(){ sel.n=cardAt(sel.numCard).n; sel.eff=null; sel.usedEffect=false;
  sel.phase="place"; render(); }

function place(si,idx){
  if(locked()||!sel||sel.phase!=="place"||!canPlace(si,idx,sel.n)) return;
  const st=G.streets[si];
  st.slots[idx].v=sel.n;
  G.inked=si+":"+idx; sel.street=si; sel.idx=idx;
  if(turnLog) turnLog.house=[si,idx];

  if(sel.eff==="temp" && sel.usedEffect) G.temp++;
  if(sel.eff==="pool"){ sel.phase="pool"; render(); return; }
  if(sel.eff==="landscaper"){ sel.phase="park"; render(); return; }
  if(sel.eff==="surveyor"){ sel.phase="fence"; render(); return; }
  if(sel.eff==="agent"){ sel.phase="agent"; render(); return; }
  if(sel.eff==="bis"){ sel.phase="bis"; render(); return; }
  awaitConfirm();
}
function doPool(yes){
  if(!sel) return;
  if(yes){
    const s=G.streets[sel.street].slots[sel.idx];
    if(s.isPool && !s.pool && G.pools<CFG.pool.length-1){ s.pool=true; G.pools++; }
  }
  if(turnLog && yes) turnLog.poolBuilt=true;
  sel.used=yes; awaitConfirm();
}
function doPark(yes){
  if(!sel) return;
  if(yes){ const st=G.streets[sel.street];
    if(st.parks < CFG.streets[sel.street].parks.length-1) st.parks++; }
  if(turnLog && yes) turnLog.parkCrossed=true;
  sel.used=yes; awaitConfirm();
}
function doFence(si,gi){ if(!sel||sel.phase!=="fence"||!fenceOK(si,gi)) return;
  G.streets[si].fences[gi]=true;
  if(turnLog) turnLog.fence=[si,gi];
  sel.used=true; sel.at="fence "+(si+1)+":"+(gi+1); awaitConfirm(); }
function doAgent(n){ if(!sel||sel.phase!=="agent") return;
  if(G.improve[n]>=CFG.estate[n].length-1) return; G.improve[n]++;
  if(turnLog) turnLog.estateColumn=n;
  sel.used=true; sel.at="size "+(n+1); awaitConfirm(); }
function doBis(si,i,v){
  if(!sel) return;
  const s=G.streets[si].slots[i];
  s.v=v; s.bis=true; G.bisCount++; G.inked=si+":"+i;
  if(turnLog) turnLog.bis=[si,i];
  sel.used=true; sel.at="street "+(si+1)+", house "+(i+1); awaitConfirm();
}
/* leaving an effect unused is a choice like any other, so it lands in the same
   place: the overlay, then confirm */
function skipEffect(){ if(!sel) return; sel.used=false; awaitConfirm(); }

/* p11: at any point in the turn, before or after the card is used. It occupies
   an empty box, is fenced on both sides, and is not a house. */
function canRoundabout(){
  return !!(CFG.roundabouts && G && G.started && !G.over && !mpIAmWaiting() &&
            !sel && G.rounds < CFG.roundaboutValues.length-1 &&
            roundaboutSpots().length);
}
function roundaboutSpots(){
  const out=[];
  G.streets.forEach((st,si)=>st.slots.forEach((s,i)=>{
    if(s.v===null && !s.round) out.push(si+":"+i);
  }));
  return out;
}
function beginRoundabout(){
  if(!canRoundabout()) return;
  sel={phase:"roundabout"};
  render();
}
function doRoundabout(si,i){
  if(!sel||sel.phase!=="roundabout") return;
  const st=G.streets[si], s=st.slots[i];
  if(s.v!==null||s.round) return;
  keep();
  s.round=true;
  if(i-1>=0) st.fences[i-1]=true;          /* fenced on both sides */
  if(i<st.fences.length) st.fences[i]=true;
  G.rounds++;
  G.inked=si+":"+i;
  if(!replaying) pendingRound=[si,i];
  sel=null;
  if(checkEnd()) return;
  render();
}

/* Asking for a refusal opens the same kind of confirmation the combinations use,
   on the refusal tile, rather than acting on the press. */
function askRefusal(){
  if(locked()||mustBuild()||sel) return;
  sel={phase:"refusing"};
  render();
}
function refuse(){
  if(locked()||mustBuild()) return;
  keep();
  turnLog={refusal:true};
  sel=null;
  G.refusals++;
  if(G.refusals>=CFG.refusal.length-1){
    /* the third one closes the sheet without going through endRound, so log it here */
    logRound(turnLog); turnLog=null;
    endGame("Third building permit refusal."); return;
  }
  endRound();
}
function endRound(){
  sel=null;
  if(turnLog){ logRound(turnLog); turnLog=null; }
  if(checkEnd()) return;
  if(MP.on){
    MP.ready[MP.me]=G.round;
    mpSend({t:"ready", round:G.round});
    render();
    mpTryAdvance();
    return;
  }
  nextRound();
  if(G.over) return;
  render();
}
function checkEnd(){
  if(G.plans.every(p=>p.done)){ endGame("All three City Plans achieved."); return true; }
  if(allBuilt()){ endGame("Every house on all three streets is built."); return true; }
  return false;
}
function endGame(why,fromPeer){
  G.over=true; sel=null; G.why=why;
  stopClock();
  const s=score();
  if(best===null||s.total>best){ best=s.total; save(); }
  if(MP.on){
    if(!fromPeer) mpSend({t:"end", reason:why});
    /* base is the score before temp is ranked, which needs everyone's counts */
    mpSend({t:"final", name:mpMyName(), temp:G.temp, base:s.total});
    MP.finals[MP.me]={name:mpMyName(), temp:G.temp, base:s.total};
  }
  render(); result(why,s);
}

/* --------------------------------------------------------- storage
   Inside a Claude artifact persistence goes through window.storage; hosted on
   an ordinary web server that object does not exist, so fall back to
   localStorage. Without this the settings would silently never save. */
const STORE=(function(){
  try{
    if(typeof window!=="undefined" && window.storage &&
       typeof window.storage.get==="function"){
      return { kind:"artifact",
        get:k=>window.storage.get(k),
        set:(k,v)=>window.storage.set(k,v),
        del:k=>window.storage.delete(k) };
    }
  }catch(e){}
  return { kind:"localStorage",
    get:k=>new Promise((res,rej)=>{
      try{ const v=localStorage.getItem(k); v===null?rej(new Error("empty")):res({value:v}); }
      catch(e){ rej(e); }
    }),
    set:(k,v)=>new Promise((res,rej)=>{
      try{ localStorage.setItem(k,v); res(); }catch(e){ rej(e); }
    })
  ,
    del:k=>new Promise(res=>{
      try{ localStorage.removeItem(k); }catch(e){}
      res();
    })
  };
})();

/* Choices that belong to the player, as opposed to facts about the game. When a
   rulebook table is corrected, these are kept and the tables are replaced. */
const PREF_KEYS=["theme","hints","city","seed","mode","planOff","relay","room",
                 "roundabouts","advanced","custom","hintsAllowed","undo"];

/* The ones that stay with the person rather than with the sheet. A shared link says
   nothing about these, and arriving through one should leave them as they were
   rather than resetting them to the defaults. */
const LOCAL_KEYS=["theme","hints","room"];

/* The printed tables, as opposed to the choices that belong to the player. Putting
   them back is what "not custom" means, so the two live together here. */
/* Which of the rulebook sections have been changed, by the names the setup screen
   gives them. A sheet played on altered tables does not compare with one played on
   the printed values, so the new sheet page says so before you start. */
function andList(xs){
  if(xs.length<=1) return xs[0]||"";
  return xs.slice(0,-1).join(", ")+" and "+xs[xs.length-1];
}
function customChanges(){
  const groups=[
    ["Streets and parks", ["streets"]],
    ["Real estate", ["estate"]],
    ["Other bonuses", ["pool","soloTempMin","soloTempPts","tempRanks","targets"]],
    ["Penalties", ["bis","roundaboutValues","refusal"]],
    ["Construction deck", ["deck"]]
  ];
  return groups.filter(([,keys])=>keys.some(k=>
    JSON.stringify(CFG[k])!==JSON.stringify(BASE[k]))).map(g=>g[0]);
}

function restoreTables(){
  const keep={};
  PREF_KEYS.forEach(k=>{ keep[k]=CFG[k]; });
  CFG=Object.assign(copy(BASE),keep);
}
/* the printed value a field stands for, by its dotted path */
function basePrinted(path){
  const parts=String(path).split(".");
  let at=BASE;
  for(const k of parts){
    if(at===null||at===undefined) return null;
    at=at[k];
  }
  if(at===null||at===undefined) return null;
  return Array.isArray(at) ? at.join(",") : at;
}
function tablesEdited(){
  const mine={}, printed={};
  Object.keys(BASE).forEach(k=>{
    if(PREF_KEYS.indexOf(k)>=0) return;
    mine[k]=CFG[k]; printed[k]=BASE[k];
  });
  return JSON.stringify(mine)!==JSON.stringify(printed);
}

async function load(){
  try{ const r=await STORE.get("welcome-2018");
    if(r&&r.value){ const d=JSON.parse(r.value);
      /* A shared link has already set everything; the stored copy must not
         race it back out. The best score is still worth restoring. */
      /* A link decides the sheet and nothing about the person opening it, so their
         own look and their own connection are carried across it. */
      /* Their own choice this session beats what was stored: the read can land after
         the page is interactive, and overwriting a setting they just changed would
         undo it in front of them. */
      if(d.cfg && sharedIn && !userSaved){
        LOCAL_KEYS.forEach(k=>{ if(d.cfg[k]!==undefined) CFG[k]=d.cfg[k]; });
      }
      let applied=false;
      if(d.cfg && !sharedIn && !userSaved){
        applied=true;
        if((d.cfg.dataVersion|0) < BASE.dataVersion){
          /* This save predates a table correction. Take the player's choices
             across and let the corrected values through, rather than leaving a
             stale guess in place forever. */
          CFG=copy(BASE);
          PREF_KEYS.forEach(k=>{ if(d.cfg[k]!==undefined) CFG[k]=d.cfg[k]; });
        } else {
          CFG=Object.assign(copy(BASE),d.cfg);
        }
        CFG.dataVersion=BASE.dataVersion;
        /* Before the gate existed, "advanced off" meant every starred plan was
           individually switched off. Translate that, but keep a deliberate mix. */
        if(d.cfg.advanced===undefined){
          const savedOff=d.cfg.planOff||{};
          const offCount=ADV_PLANS.filter(q=>savedOff[q.id]).length;
          if(offCount===ADV_PLANS.length){
            CFG.advanced=false;
            ADV_PLANS.forEach(q=>{ delete CFG.planOff[q.id]; });
          } else {
            CFG.advanced=true;          /* a curated mix, or all of them on */
          }
        }
        /* Plan ids are derived from the requirement itself, so a corrected plan
           table can leave stored choices naming plans that no longer exist.
           Drop them rather than carry them around for ever. */
        const knownIds=BASIC_PLANS.concat(ADV_PLANS).map(q=>q.id);
        Object.keys(CFG.planOff||{}).forEach(k=>{
          if(knownIds.indexOf(k)<0) delete CFG.planOff[k];
        });
        ensureCategories();
        CFG.city=String(CFG.city||"").trim().slice(0,CITY_MAX).trim();
      }
      if(typeof d.best==="number") best=d.best;
      applyTheme(CFG.theme);
      renderCity();
      syncHintsButton();
      /* Dealing again opens the new sheet page. If the player has opened something
         else while the settings were on their way, put them back on it. */
      /* Dealing again is only for when stored settings were actually applied, and
         never over a sheet already being played: it resets the board. */
      if(applied && !(G && G.started)){
        const was=openPanel;
        newGame();
        if(was && was!==briefing) was();
      }
      } }catch(e){}
}
/* ------------------------------------------------------ resuming a sheet
   The board is plain data, so a sheet in progress can be written down and picked up
   again. Two things need care. The clock keeps wall clock timestamps, so it is
   stored as elapsed time and rebased on the way back in, otherwise a sheet resumed
   the next morning would show eight hours on it. And the turn in progress is stored
   too, so closing the tab halfway through choosing an effect leaves you where you
   were rather than losing the round. */
/* Many sheets, not one. Each is stored whole, with the settings it was played under,
   so it can be described and resumed exactly as it was left. */
const SHEETS_KEY="welcome-to-sheets";
const KEEP_RUNNING=10;              /* the ten most recent sheets still in progress */
const KEEP_FINISHED_DAYS=7;         /* a finished sheet is worth looking at for a week */
const DAY=86400000;

function newSheetId(){
  return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
/* Throw away what nobody would want: finished sheets past their week, and running
   sheets beyond the ten most recent. The most recently played survive. */
function pruneSheets(list){
  const now=Date.now();
  const kept=list.filter(x=>{
    if(!x || !x.game) return false;
    if(!x.finished) return true;
    return (now-(x.lastPlayed||x.created||now)) < KEEP_FINISHED_DAYS*DAY;
  });
  const running=kept.filter(x=>!x.finished)
    .sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0));
  const drop=new Set(running.slice(KEEP_RUNNING).map(x=>x.id));
  return kept.filter(x=>!drop.has(x.id))
    .sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0));
}
async function loadSheets(){
  try{
    const r=await STORE.get(SHEETS_KEY);
    if(!r||!r.value) return [];
    const d=JSON.parse(r.value);
    if(!d || d.v!==1 || !Array.isArray(d.sheets)) return [];
    return pruneSheets(d.sheets);
  }catch(e){ return []; }
}
async function putSheets(list){
  try{ await STORE.set(SHEETS_KEY, JSON.stringify({v:1, sheets:pruneSheets(list)}));
       return true; }
  catch(e){ return false; }
}

function clockOut(){
  const now=Date.now();
  return {
    rounds: T.rounds.slice(),
    stopped: !!T.stopped, running: !!T.running,
    /* elapsed, not a start time */
    total: !T.running ? 0 : (T.stopped ? T.total : now-T.start),
    inRound: (T.stopped || T.roundStart===null) ? null : now-T.roundStart
  };
}
function clockIn(c){
  if(!c) return;
  const now=Date.now();
  T.rounds = Array.isArray(c.rounds) ? c.rounds.slice() : [];
  T.stopped = !!c.stopped;
  T.running = !!c.running;
  T.total = c.total||0;
  T.start = now-(c.total||0);
  T.roundStart = (c.inRound===null||c.inRound===undefined) ? null : now-c.inRound;
}

/* Storage is rate limited, and the sheet is a few thousand characters, so this
   writes as little as it can get away with: nothing before the sheet is dealt,
   nothing when the state has not actually changed, and one write for a burst of
   changes rather than one each. */
let lastWritten=null;
async function saveSheet(){
  if(!G || !G.started) return false;
  if(!G.id || buried[G.id]){ G.id=newSheetId(); G.created=Date.now(); }
  const entry={
    id:G.id, created:G.created||Date.now(), lastPlayed:Date.now(),
    finished:!!G.over,
    /* what it scored, so a finished sheet can be listed without rebuilding it */
    total:score().total,
    cfg:CFG, game:G, sel:sel, snap:snap, clock:clockOut()
  };
  const body=JSON.stringify(entry);
  /* neither the clock nor the moment of writing is worth a write of its own */
  const same=lastWritten && sameBar(lastWritten, body);
  if(same) return false;
  lastWritten=body;
  if(buried[G.id]) return false;      /* it was deleted while this save was in flight */
  const list=await loadSheets();
  const at=list.findIndex(x=>x.id===G.id);
  if(at>=0) list[at]=entry; else list.push(entry);
  const ok=await putSheets(list);
  /* what the screens believe is stored, so the way back to the overview appears the
     moment the first sheet is written rather than only on the next visit */
  if(ok) sheetsList=pruneSheets(list);
  return ok;
}
/* two payloads that differ only in the clock are the same as far as writing goes */
function sameBar(a,b){
  const strip=x=>x.replace(/"clock":\{[^}]*\}/,"")
                  .replace(/"lastPlayed":\d+/,"");
  return strip(a)===strip(b);
}
/* render() runs after every change, so that is the hook; the delay keeps a burst
   of updates to one write. */
let saveTimer=null;
function queueSave(){
  if(replaying) return;
  if(typeof setTimeout!=="function"){ saveSheet(); return; }
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ saveTimer=null; saveSheet(); }, 900);
}
/* Forget sheets by id. Several go in one read and one write: doing them one at a time
   meant four calls each reading the same list and writing back their own copy of it,
   and the last write won, so most of the deletions were lost. */
/* Ids that have been deleted. A save queued before the deletion can land after it, and
   would write the sheet straight back: every change queues a save, so deleting the sheet
   you are playing is exactly when one is most likely to be in flight. */
const buried=Object.create(null);
async function deleteSheets(ids){
  const gone=[].concat(ids);
  if(!gone.length) return false;
  gone.forEach(id=>{ buried[id]=true; });
  const list=await loadSheets();
  return putSheets(list.filter(x=>gone.indexOf(x.id)<0));
}
function deleteSheet(id){ return deleteSheets([id]); }
/* Everything a sheet needs, and nothing that would make a stale save dangerous:
   a board from an older data version, or one whose shape no longer matches, is
   refused rather than half restored. */
function sheetUsable(d){
  /* the version lives on the list that holds these, not on each entry */
  if(!d || !d.game) return false;
  const g=d.game;
  if(!Array.isArray(g.streets) || g.streets.length!==3) return false;
  if(!Array.isArray(g.plans) || !g.plans.length) return false;
  if(g.streets.some(st=>!st || !Array.isArray(st.slots) || !Array.isArray(st.fences)))
    return false;
  /* Its own settings, not the ones in force: a sheet played with custom street
     lengths must still be resumable when the current settings differ. The settings
     call it lots; the board calls the array slots. */
  const own=(d.cfg&&d.cfg.streets)||CFG.streets;
  const shape=own.map(x=>x.lots).join(",");
  if(g.streets.map(st=>st.slots.length).join(",")!==shape) return false;
  return true;
}
function restoreSheet(d){
  lastWritten=null;
  G=d.game;
  sel=d.sel||null;
  snap=d.snap||null;
  clockIn(d.clock);
  render();
  /* The new sheet page is up when the page loads. A resumed sheet is already under
     way, so get it out of the way rather than making the player dismiss a dialog
     about dealing a sheet they are in the middle of. */
  if(G.started) forceCloseBox();
}

/* Pick a stored sheet up, settings and all, so the theme, the city name and the
   variants come back with the board. */
function resumeStored(d){
  if(!sheetUsable(d)) return false;
  if(d.cfg){ CFG=Object.assign(copy(BASE),d.cfg); CFG.dataVersion=BASE.dataVersion; }
  /* a theme that has since been removed would leave the page half painted */
  if(!THEMES[CFG.theme]) CFG.theme=BASE.theme;
  applyTheme(CFG.theme);
  renderCity();
  syncHintsButton();
  restoreSheet(d);
  return true;
}
/* On loading: if anything is in progress, offer the sheets rather than dealing over
   them. Reading takes a moment, so it yields to anything begun in the meantime. */
async function offerSheets(){
  if(G && G.started) return false;
  let list=await loadSheets();
  if(G && G.started) return false;
  if(!list.length) return false;
  activeSheets(list);
  return true;
}
/* Set once the player changes a setting. The stored settings arrive after the page is
   interactive, and applying them over a choice just made would undo it. */
let userSaved=false;
async function save(){
  userSaved=true;
  try{
    /* the id list lets a later version tell a newly added plan apart from one
       the player deliberately switched on */
    await STORE.set("welcome-2018",JSON.stringify({
      cfg:CFG, best:best,
      known:BASIC_PLANS.concat(ADV_PLANS).map(p=>p.id)
    }));
  }catch(e){}
}

/* ------------------------------------------------------------ hint maths
   In the solo variant the deck is dealt once and never reshuffled, so these
   are exact probabilities over the cards that remain, not estimates. */
function atLeastOneIn3(k, pool){
  if(k<=0) return 0;
  if(pool<=3) return 1;
  let miss=1;
  for(let i=0;i<3;i++) miss *= (pool-k-i)/(pool-i);
  return 1-miss;
}
function soloStats(){
  const cons=G.deck.filter(c=>!c.solo);
  const pool=cons.length;
  const nums={}, effs={};
  cons.forEach(c=>{ nums[c.n]=(nums[c.n]||0)+1; effs[c.e]=(effs[c.e]||0)+1; });

  /* The Solo card was shuffled into the bottom half, which was then placed
     underneath, so it cannot appear until that half is reached. */
  const total=deckTotal()+1, half=Math.ceil(deckTotal()/2);
  const drawn=total-G.deck.length;
  const eligible=total-Math.max(drawn,half);
  /* near the end fewer than three cards may remain, so the look-ahead
     window has to be capped by what is actually left */
  const canDraw=Math.min(3, G.deck.length);
  const window3=Math.max(0, Math.min(canDraw, drawn+canDraw-half));
  const soloP = eligible>0 ? Math.min(1, window3/eligible) : 0;
  const earliest=Math.ceil((half+1)/3);

  return {pool:pool, nums:nums, effs:effs, soloP:soloP, earliest:earliest, drawn:drawn};
}
function standardStats(){
  /* The top card of each stack is known both ways round: its number is printed
     large and its effect shows in the corners of the card in front of it. So
     everything still unknown is what lies beneath, and that is counted here for
     effects as well as numbers. */
  return G.stacks.map(st=>{
    const below=st.slice(1);
    const nums={}, effs={};
    below.forEach(c=>{ nums[c.n]=(nums[c.n]||0)+1; effs[c.e]=(effs[c.e]||0)+1; });
    return {pool:below.length, nums:nums, effs:effs};
  });
}

/* ====================================================== MULTIPLAYER
   Welcome To is simultaneous: everyone plays the same three combinations at
   once. Because both clients derive the deck from the same seed, no card data
   is ever sent. The relay carries only coordination:

     ready  - I have finished round N
     plan   - I claimed City Plan X in round N   (first in a round scores high)
     end    - I triggered an end condition
     final  - my temp agency count and my score before temp is ranked

   which is a few dozen bytes per round.                                     */
/* Multiplayer is complete but switched off for now. Set this to true to bring
   the buttons back; nothing else needs changing. */
const MP_ENABLED=false;

/* Where players would meet. Fixed rather than a setting: nobody should have to know an
   address to play with somebody, and a box to type one into is a box to get one wrong. */
const EXCHANGE="https://exchange.welcome-to.sunken.dev/";
/* What the last enquiry found. Multiplayer is offered only if it answered. */
let exchangeInfo={asked:false, up:false, ms:null, version:null};

/* Ask whether it is there, and how long it took to say so. Never throws: a sheet must not
   care whether anything is listening. */
async function askExchange(){
  const began=(typeof performance==="object"&&performance.now)?performance.now():Date.now();
  const now=()=>((typeof performance==="object"&&performance.now)?performance.now():Date.now());
  try{
    if(typeof fetch!=="function") throw new Error("no fetch");
    const ctl=(typeof AbortController==="function") ? new AbortController() : null;
    const bell=ctl && typeof setTimeout==="function"
      ? setTimeout(()=>ctl.abort(), 4000) : null;
    const r=await fetch(EXCHANGE, ctl?{signal:ctl.signal}:undefined);
    if(bell && typeof clearTimeout==="function") clearTimeout(bell);
    const ms=Math.round(now()-began);
    if(!r || !r.ok) throw new Error("no answer");
    const d=await r.json();
    exchangeInfo={asked:true, up:!!(d&&d.ok), ms:ms, version:(d&&d.version)||null};
  }catch(e){
    exchangeInfo={asked:true, up:false, ms:null, version:null};
  }
  return exchangeInfo;
}

/* The names of the ways to play, in one place: the setup screen offers them and the
   new sheet page reports them, and the two should not word it differently. */
const MODE_NAMES={standard:"Standard Turn", solo:"Solo Variant", multiplayer:"Multiplayer"};

const MP={
  on:false, ws:null, status:"offline",   /* offline connecting lobby lost */
  room:"", me:null, players:[], participants:[], inProgress:false,
  ready:{}, claims:[], finals:{}, endedBy:null, error:""
};
let MP_SOCKET=(url)=>new WebSocket(url);      /* replaced in tests */
let roomOpen=false;
let shareOpen=false;

function mpHostId(){ return MP.players.length?MP.players[0].id:null; }
function mpIsHost(){ return MP.me!==null && MP.me===mpHostId(); }
function mpWho(id){
  const p=MP.players.find(x=>x.id===id);
  return p?p.name:(MP.finals[id]?MP.finals[id].name:"a player");
}
function mpMyName(){ return (CFG.city||"").trim() || "Architect"; }
function mpSend(o){
  try{ if(MP.ws && MP.ws.readyState===1) MP.ws.send(JSON.stringify(o)); }catch(e){}
}
/* only the players who were present when the sheet started, and who are still
   connected, are waited for */
function mpActiveIds(){
  const base=MP.participants.length?MP.participants:MP.players.map(p=>p.id);
  return base.filter(id=>MP.players.some(p=>p.id===id));
}
function mpWaitingFor(){
  if(!MP.on||!G||!G.started||G.over) return [];
  return mpActiveIds().filter(id=>(MP.ready[id]||0)<G.round).map(mpWho);
}
function mpIAmWaiting(){
  return MP.on && G && G.started && !G.over && (MP.ready[MP.me]||0)>=G.round;
}

function mpConnect(room){
  const base=EXCHANGE.replace(/\/+$/,"");
  if(!base){ MP.error="Enter the relay address first."; return renderRoom(); }
  room=String(room||"").toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,16);
  if(room.length<4){ MP.error="Room codes need at least four characters."; return renderRoom(); }
  mpDisconnect(true);
  MP.room=room; MP.error=""; MP.status="connecting";
  CFG.room=room; save();
  const url=base.replace(/^http/,"ws")+"/room/"+room+"?name="+encodeURIComponent(mpMyName());
  let ws;
  try{ ws=MP_SOCKET(url); }
  catch(e){ MP.status="offline"; MP.error="Could not open a connection."; return renderRoom(); }
  MP.ws=ws;
  ws.onopen=()=>{
    MP.on=true; MP.status="lobby"; MP.error="";
    /* the solo variant is a solo game; multiplayer is always the standard turn */
    if(CFG.mode!=="standard"){
      CFG.mode="standard"; save();
      if(G && !G.started) newGame();
    }
    renderRoom(); render();
  };
  ws.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } mpReceive(m); };
  ws.onclose=()=>{ if(MP.on){ MP.status="lost"; MP.error="Connection closed."; }
                   renderRoom(); render(); };
  ws.onerror=()=>{ MP.error="Connection error."; renderRoom(); };
}
function mpDisconnect(quiet){
  try{ if(MP.ws){ MP.ws.onclose=null; MP.ws.close(); } }catch(e){}
  MP.ws=null; MP.on=false; MP.me=null; MP.players=[];
  MP.ready={}; MP.claims=[]; MP.finals={}; MP.endedBy=null;
  MP.participants=[]; MP.inProgress=false; MP.status="offline";
  if(!quiet){ renderRoom(); render(); }
}

function planFromIds(ids){
  if(!Array.isArray(ids)) return [];
  const all=BASIC_PLANS.concat(ADV_PLANS);
  const out=[];
  ids.forEach(id=>{
    const p=all.find(x=>x.id===id);
    if(p) out.push(Object.assign({},p,{done:false,scored:0}));
  });
  return out;
}
function mpApplySetup(m){
  if(!m||!m.seed) return;
  CFG.seed=m.seed; CFG.mode="standard";
  CFG.roundabouts=!!m.roundabouts;      /* everyone plays the same variant */
  newGame();                       /* the seed rebuilds the identical deck */
  const p=planFromIds(m.planIds);
  if(p.length===3) G.plans=p;      /* sent explicitly rather than re-derived */
  G.planRoll=m.planRoll|0;
  startGame(true);
}

function mpReceive(m){
  switch(m.t){
    case "welcome":
      MP.me=m.you;
      /* the relay replays the host's setup; if one exists the sheet is already
         under way, so joining now would start us rounds behind */
      if(m.setup) MP.inProgress=true;
      break;
    case "roster":
      MP.players=Array.isArray(m.players)?m.players:[];
      Object.keys(MP.ready).forEach(id=>{
        if(!MP.players.some(p=>p.id===id)) delete MP.ready[id];
      });
      mpTryAdvance();
      break;
    case "setup":
      MP.inProgress=false;
      if(!(G&&G.started)) mpApplySetup(m);
      break;
    case "ready":
      MP.ready[m.from]=Math.max(MP.ready[m.from]||0,m.round|0);
      mpTryAdvance();
      break;
    case "plan":
      MP.claims.push({planId:m.planId, round:m.round|0, by:m.from});
      break;
    case "end":
      if(G && G.started && !G.over){
        MP.endedBy=m.from;
        endGame(mpWho(m.from)+" ended the game \u2014 "+(m.reason||""), true);
        return;                    /* endGame renders and reopens the scoresheet */
      }
      break;
    case "final":
      MP.finals[m.from]={name:m.name||mpWho(m.from), temp:m.temp|0, base:m.base|0};
      if(G && G.over){ render(); result(G.why,score()); return; }
      break;
  }
  renderRoom(); render();
}

function mpTryAdvance(){
  if(!MP.on||!G||!G.started||G.over) return;
  const ids=mpActiveIds();
  if(!ids.length) return;
  if(!ids.every(id=>(MP.ready[id]||0)>=G.round)) return;
  nextRound();
  if(G.over) return;
  render();
}

/* p7: most boxes scores 7, next 4, third 1, ties score the same, none scores
   nothing. Only resolvable once every player has reported. */
function mpTempCounts(){
  const out=[G?G.temp:0];
  Object.keys(MP.finals).forEach(id=>{
    if(id!==MP.me) out.push(MP.finals[id].temp);
  });
  return out;
}
/* Ranking resolves only once the sheet is closed and every player still in the
   game has reported. Someone merely sitting in the room, or who left without
   finishing, must not hold it up forever. */
function mpFinalsIn(){
  if(!MP.on || !G || !G.over) return false;
  return mpActiveIds().filter(id=>id!==MP.me).every(id=>!!MP.finals[id]);
}
function positionalTemp(mine,counts){
  if(!(mine>0)) return 0;
  const tiers=[...new Set(counts.filter(c=>c>0))].sort((a,b)=>b-a);
  const ranks=CFG.tempRanks||[7,4,1];
  const at=tiers.indexOf(mine);
  return ranks[at]===undefined?0:ranks[at];
}

/* ------------------------------------------------------- the city name
   The printed sheet has a blank for this in its top corner. Clicking the
   ellipsis in the masthead fills it in. */
/* label plus a fixed-width on/off slot */
function tglLabel(label,on){
  return label+': <span class="tgl">'+(on?"on":"off")+'</span>';
}
function esc(t){
  return String(t).replace(/[&<>"']/g,c=>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
/* The name appears in the masthead and again on the briefing, so the widget is
   rendered per slot. Only one slot is ever in edit mode; the rest mirror it. */
const CITY_SLOTS=["cityslot","briefcity"];
const CITY_MAX=20;             /* the name has to fit the masthead and the briefing */
let cityEditing=null;          /* the id of the slot being edited, or null */
function renderCity(){
  const name=(CFG.city||"").trim();
  CITY_SLOTS.forEach(sid=>{
    const slot=document.getElementById(sid);
    if(!slot) return;          /* the briefing slot only exists while it is open */
    if(cityEditing===sid){
      slot.innerHTML='<input class="cityinput" id="'+sid+'-in" maxlength="'+CITY_MAX+'" value="'+
        esc(name)+'" aria-label="Name of your city" placeholder="\u2026">';
      const inp=document.getElementById(sid+"-in");
      inp.onkeydown=e=>{
        if(e.key==="Enter"){ e.preventDefault(); commitCity(inp.value); }
        else if(e.key==="Escape"){ e.preventDefault(); cityEditing=null; renderCity(); }
      };
      inp.onblur=()=>{ if(cityEditing===sid) commitCity(inp.value); };
      inp.focus(); inp.select();
    } else {
      slot.innerHTML='<button class="cityname'+(name?"":" empty")+'" id="'+sid+'-btn" '+
        'aria-label="Name of your city" title="'+
        (name?"Rename your city":"Name your city")+'">'+
        (name?esc(name):"\u2026")+'</button>';
      document.getElementById(sid+"-btn").onclick=()=>{ cityEditing=sid; renderCity(); };
    }
  });
  document.title="Welcome To "+(name||"\u2026");
}
let seedEditing=false;
function renderSeed(){
  const slot=document.getElementById("seedslot");
  if(!slot||!G) return;
  if(seedEditing){
    slot.innerHTML='<input class="seedinput" id="seedinput" maxlength="24" spellcheck="false" '+
      'value="'+esc(G.seed)+'" aria-label="Sheet seed">';
    const inp=document.getElementById("seedinput");
    inp.onkeydown=e=>{
      if(e.key==="Enter"){ e.preventDefault(); commitSeed(inp.value); }
      else if(e.key==="Escape"){ e.preventDefault(); seedEditing=false; renderSeed(); }
    };
    inp.onblur=()=>{ if(seedEditing) commitSeed(inp.value); };
    inp.focus(); inp.select();
  } else {
    const fixed=!!normalizeSeed(CFG.seed);
    slot.innerHTML='<button class="seedname" id="seedbtn" '+
        'title="Type a seed here to rebuild this exact sheet">'+esc(G.seed)+'</button>'+
      '<button class="seedroll" id="seedroll" title="New random seed" '+
        'aria-label="New random seed">\u21bb</button>'+
      '<button class="seedroll seedpin'+(fixed?" on":"")+'" id="seedpin" title="'+
        (fixed?"Let the next sheet roll a new seed":"Keep this seed for the next sheet")+
        '" aria-pressed="'+(fixed?"true":"false")+'" aria-label="Pin this seed">'+
        glyph("pin","")+'</button>'+
      '<span class="seednote">'+(fixed?"fixed":"new each sheet")+
      (G.planRoll?" \u00b7 plans rerolled \u00d7"+G.planRoll:"")+'</span>';
    document.getElementById("seedbtn").onclick=()=>{ seedEditing=true; renderSeed(); };
    document.getElementById("seedroll").onclick=()=>{ CFG.seed=""; save(); newGame(); };
    /* Pinning only decides whether this seed is kept for the next sheet, so it
       must not deal again: the sheet in front of you stays as it is. */
    document.getElementById("seedpin").onclick=()=>{
      CFG.seed = normalizeSeed(CFG.seed) ? "" : G.seed;
      save(); renderSeed();
    };
  }
}
function commitSeed(v){
  seedEditing=false;
  CFG.seed=normalizeSeed(v);
  save();
  newGame();          /* rebuilds the sheet deterministically from the new seed */
}

function commitCity(v){
  /* trim again after slicing, or cutting mid-word leaves a trailing space in
     the stored value that the display would quietly hide */
  CFG.city=String(v||"").trim().slice(0,CITY_MAX).trim();
  cityEditing=null;
  save();
  renderCity();
}

/* ========================================================== RENDER */
const $=id=>document.getElementById(id);
function render(){
  /* the same heading whichever way the sheet is being played: what the cards are for
     belongs on the cards and in the Rules panel, not in the heading above them */
  panelLabel("handhead", "Card stacks");
  $("rd-round").textContent=G.round;
  /* The standard turn deals three stacks rather than one deck, which is why this
     used to read as an em dash there. Either way it is the cards not yet taken,
     over however many were dealt. */
  $("rd-deck").textContent = cardsLeft()+"/"+(G.dealt||cardsLeft());
  $("rd-built").textContent=houses()+"/"+buildable();
  const s=score(), el=$("rd-score");
  el.textContent=s.total; el.classList.toggle("bad",s.total<0);
  $("rd-best").textContent=best===null?"\u2014":best;
  hand(); streets(); stair(); plans(); tracks(); sheet(s); hints(); status();
  tickClock();
  queueSave();          /* after every change, so a closed tab loses nothing */
}

function pct(p){ return (p*100).toFixed(p>=0.095?0:1)+"%"; }
/* How many empty houses a number could legally be written in, as the sheet
   stands. Roundabouts are not speculated about: this is the board as it is, so
   the figure is what is available without taking one. Note the counts are not
   independent \u2014 filling one space changes the rest \u2014 so it measures slack
   rather than a number of futures. */
function spotsFor(n){
  let k=0;
  for(let si=0;si<G.streets.length;si++)
    for(let i=0;i<G.streets[si].slots.length;i++)
      if(canPlace(si,i,n)) k++;
  return k;
}

/* Whether an effect could do anything at all on the sheet as it stands. Several
   act on the street the house goes in, so this answers "somewhere", not "here". */
function effectUsable(e){
  switch(e){
    case "surveyor":
      for(let a=0;a<G.streets.length;a++)
        for(let b=0;b<G.streets[a].fences.length;b++) if(fenceOK(a,b)) return true;
      return false;
    case "landscaper": return G.streets.some((st,i)=>!allParks(i));
    case "pool": return G.pools<CFG.pool.length-1 &&
      G.streets.some(st=>st.slots.some(x=>x.isPool && !x.pool && x.v===null));
    /* the same keys doAgent uses, so the two cannot disagree about the columns */
    case "agent": return Object.keys(G.improve)
      .some(k=>G.improve[k] < CFG.estate[k].length-1);
    case "temp": return G.temp < CFG.deck.temp.length;
    case "bis": return bisTargets().length>0;
  }
  return true;
}

/* The companion to the number chart: not how likely a number is, but how much
   room is left for it. A number with no room is either finished or waiting on a
   temp shift, and those read differently. */
/* An effect in the hints: the glyph, then its name, how many are left and
   whether it could do anything, then the figure beside all three. */
/* The chance a number turns up next round in at least one of the three stacks.
   The stacks are independent piles and each reveals one card, so this is one
   minus the chance of missing it in all three \u2014 not the sum of the three, which
   would overcount the rounds where it appears twice. */
/* What one completed estate of a given size is worth, at the column's current
   height. Shared by the scoresheet and by the hint that asks what a fence would
   be worth. */
function estateValue(n){
  const col=CFG.estate[n];
  return col[Math.min(G.improve[n],col.length-1)];
}
function estatePoints(){
  return estates().reduce((a,e)=>a+estateValue(e.size),0);
}

/* What the best available fence would be worth. A fence scores nothing itself:
   it closes an estate, and closing one can also complete a City Plan. Each legal
   position is tried by flipping that one fence and measuring, so no board is
   copied; the flip is undone immediately. */
function fenceWorth(){
  const base=estatePoints();
  const open=G.plans.filter(p=>!p.done && p.req);
  let best=null;
  for(let si=0;si<G.streets.length;si++){
    const st=G.streets[si];
    for(let gi=0;gi<st.fences.length;gi++){
      if(!fenceOK(si,gi)) continue;
      st.fences[gi]=true;
      const est=estatePoints()-base;
      let plan=0, planName="";
      open.forEach(p=>{
        if(matchPlan(p)){
          const v=G.approved ? p.lo : p.hi;
          plan+=v;
          planName=planName || ("plan n\u00b0"+p.n);
        }
      });
      st.fences[gi]=false;
      const total=est+plan;
      if(!best || total>best.total)
        best={total:total, est:est, plan:plan, planName:planName, si:si, gi:gi};
    }
  }
  return best;
}

/* Where the room actually is. The chart above counts lots across the whole sheet,
   which hides the case that matters: six lots all in one street commits you to
   that street's parks, pools and estates. Rows are streets, columns numbers. */
function streetMatrix(){
  const range=numberHist();
  let h='<div class="hmat" style="grid-template-columns:auto repeat('+
    (range.hi-range.lo+1)+',minmax(0,1fr))">';
  h+='<span class="hmh"></span>';
  for(let n=range.lo;n<=range.hi;n++) h+='<span class="hmh">'+n+'</span>';
  G.streets.forEach((st,si)=>{
    h+='<span class="hms">'+(si+1)+'</span>';
    for(let n=range.lo;n<=range.hi;n++){
      let k=0;
      for(let i=0;i<st.slots.length;i++) if(canPlace(si,i,n)) k++;
      h+='<span class="hmc'+(k===0?" nil":"")+'" title="Street '+(si+1)+', number '+n+
         ': '+k+(k===1?" lot":" lots")+'">'+(k||"\u00b7")+'</span>';
    }
  });
  return h+'</div>';
}

/* What an effect would gain as the sheet stands. Several depend on which street
   or column you pick, so this is the best on offer, not a promise. */
function effectValue(e){
  const step=(ladder,at)=> (at+1<ladder.length) ? (ladder[at+1]-ladder[at]) : 0;
  switch(e){
    case "pool": {
      const v=step(CFG.pool,G.pools);
      return v>0 ? {t:"+"+v, why:"the next pool box is worth "+v} : {t:"\u2014", why:"the pool ladder is full"};
    }
    case "landscaper": {
      let best=0, where=0;
      G.streets.forEach((st,i)=>{
        const v=step(CFG.streets[i].parks, st.parks);
        if(v>best){ best=v; where=i+1; }
      });
      return best>0 ? {t:"+"+best, why:"best next park is "+best+", on street "+where}
                    : {t:"\u2014", why:"every park is crossed"};
    }
    case "bis": {
      const v=step(CFG.bis,G.bisCount);
      return v>0 ? {t:"\u2212"+v, why:"the next bis costs "+v} : {t:"\u2014", why:"the bis ladder is full"};
    }
    case "temp": {
      if(MP.on) return {t:"?", why:"ranked against the other players at the end"};
      const need=CFG.soloTempMin-G.temp;
      if(need<=0) return {t:"\u2014", why:"the threshold is already met"};
      return need===1 ? {t:"+"+CFG.soloTempPts, why:"one more temp reaches the threshold"}
                      : {t:need+" more", why:need+" more temps reach the threshold"};
    }
    case "agent": {
      let best=0, size=0;
      Object.keys(G.improve).forEach(k=>{
        const v=step(CFG.estate[k], G.improve[k]);
        if(v>best){ best=v; size=k; }
      });
      return best>0 ? {t:"+"+best, why:"best rise is "+best+" a house, on size "+size}
                    : {t:"\u2014", why:"every column is at its top"};
    }
    case "surveyor": {
      const b=fenceWorth();
      if(!b) return {t:"\u2014", why:"there is nowhere left to draw a fence"};
      if(b.total<=0) return {t:"+0", why:"no fence closes an estate yet"};
      const where="street "+(b.si+1)+", after house "+(b.gi+1);
      return {t:"+"+b.total, why: b.plan>0
        ? "best fence closes "+b.est+" of estate and completes "+b.planName+
          " for "+b.plan+", at "+where
        : "best fence closes an estate worth "+b.est+", at "+where};
    }
  }
  return {t:"\u2014", why:""};
}

function anyStackBars(st){
  const range=numberHist();
  const items=[];
  for(let n=range.lo;n<=range.hi;n++){
    let miss=1, k=0;
    st.forEach(s2=>{
      const c=s2.nums[n]||0;
      k+=c;
      if(s2.pool>0) miss *= (1-c/s2.pool);
    });
    items.push({n:n, k:k, p:1-miss});
  }
  const max=Math.max.apply(null, items.map(i=>i.p)) || 1;
  return '<div class="hstrip">'+items.map(i=>
    '<div class="hcell'+(i.k===0?" zero":"")+'" title="'+i.k+
      ' across the three stacks">'+
      '<div class="hbarwrap"><span class="hbar" style="height:'+
        (i.p<=0?2:Math.max(4,Math.round(100*i.p/max)))+'%"></span></div>'+
      '<span class="hlbl">'+i.n+'</span>'+
      '<span class="hpct">'+(i.k===0?"\u2013":pct(i.p))+'</span>'+
    '</div>').join("")+'</div>';
}

function effCell(e, left, figure){
  const ok=effectUsable(e), val=effectValue(e);
  return '<div class="heffcell'+(ok?"":" idle")+'" title="'+
    (ok?"Something on the sheet can take this effect"
       :"Nothing on the sheet can take this effect as it stands")+'">'+
    glyph(e,"")+
    '<span class="einfo">'+
      '<span class="ename">'+EFFECTS[e].short+'</span>'+
      '<span class="ecount">'+left+' left</span>'+
      '<span class="euse">'+(ok?"usable":"unusable")+'</span>'+
      '<span class="eval" title="'+esc(val.why)+'">'+val.t+'</span>'+
    '</span>'+
    '<span class="ep">'+figure+'</span></div>';
}

function spotBars(){
  const range=numberHist();
  const items=[];
  for(let n=range.lo;n<=range.hi;n++){
    const k=spotsFor(n);
    items.push({n:n, k:k, rescue:k===0 && numberUsable(n,true)});
  }
  const max=Math.max.apply(null, items.map(i=>i.k)) || 1;
  return '<div class="hstrip">'+items.map(i=>
    '<div class="hcell'+(i.k===0?(i.rescue?" rescue":" dead"):"")+'" title="'+
      (i.k===0 ? (i.rescue?"nowhere as it stands, but a temp shift would reach one"
                         :"nowhere left, and no shift reaches one")
               : i.k+(i.k===1?" space":" spaces"))+'">'+
      '<div class="hbarwrap"><span class="hbar" style="height:'+
        (i.k<=0?2:Math.max(4,Math.round(100*i.k/max)))+'%"></span></div>'+
      '<span class="hlbl">'+i.n+'</span>'+
      '<span class="hpct">'+(i.k===0?(i.rescue?"\u00b12":"\u2014"):i.k)+'</span>'+
    '</div>').join("")+'</div>';
}

function bars(nums, pool, scoreFn){
  const range=numberHist();
  const items=[];
  for(let n=range.lo;n<=range.hi;n++){
    const k=nums[n]||0;
    items.push({n:n, k:k, p:pool>0?scoreFn(k,pool):0});
  }
  const max=Math.max.apply(null, items.map(i=>i.p)) || 1;
  return '<div class="hstrip">'+items.map(i=>
    '<div class="hcell'+(i.k===0?" zero":"")+'" title="'+i.k+' left">'+
      '<div class="hbarwrap"><span class="hbar" style="height:'+
        (i.p<=0?2:Math.max(4,Math.round(100*i.p/max)))+'%"></span></div>'+
      '<span class="hlbl">'+i.n+'</span>'+
      '<span class="hpct">'+(i.k===0?"\u2013":pct(i.p))+'</span>'+
    '</div>').join("")+'</div>';
}

function hints(){
  const box=$("hint");
  const showing = CFG.hintsAllowed && CFG.hints;
  box.hidden=!showing;
  if(!showing) return;
  const body=$("hintbody");
  panelLabel("hinthead", "Hints");

  if(CFG.mode==="solo"){
    const st=soloStats();
    let h='<div class="hgrid">'+
          '<div><div class="hrow"><div class="hcap">Effects still to come, and what '+
          'each is worth</div>'+
          '<div class="heff">'+Object.keys(EFFECTS).map(e=>{
            const k=st.effs[e]||0;
            return effCell(e, k, k?pct(atLeastOneIn3(k,st.pool)):"\u2013");
          }).join("")+'</div></div></div>'+
          '<div><div class="hrow"><div class="hcap">Lots each number still fits '+
          '(without roundabouts)</div>'+
          spotBars()+'</div>'+
          '<div class="hrow"><div class="hcap">Which street those lots are in</div>'+
          streetMatrix()+'</div></div>'+
          '<div><div class="hrow"><div class="hcap">House number \u2014 chance it appears '+
          'among your next <em>three</em> cards</div>'+
          bars(st.nums, st.pool, atLeastOneIn3)+'</div></div>'+
          '</div>';
    h+='<div class="hfoot"><b>'+st.pool+'</b> construction cards left. Solo card: '+
       (G.soloSeen
         ? 'already drawn, plans are approved.'
         : (st.soloP>0
             ? '<b>'+pct(st.soloP)+'</b> chance in your next draw.'
             : 'cannot appear before round <b>'+st.earliest+'</b>.'))+
       ' Average round <b>'+fmt(avgRound())+'</b>.</div>';
    body.innerHTML=h;
  } else {
    const st=standardStats();
    const pool=st.reduce((a,x)=>a+x.pool,0);
    const tally={};
    st.forEach(x=>Object.keys(x.effs).forEach(e=>{ tally[e]=(tally[e]||0)+x.effs[e]; }));

    /* the effects first, then the draw chances, then the stack by stack detail */
    let h='<div class="hgrid">'+
       '<div><div class="hrow"><div class="hcap">Effects still to come, and what '+
       'each is worth</div>'+
       '<div class="heff">'+Object.keys(EFFECTS).map(e=>{
         const k=tally[e]||0;
         return effCell(e, k, (pool&&k)?pct(k/pool):"\u2013");
       }).join("")+'</div></div></div>'+
       '<div>'+
       '<div class="hrow"><div class="hcap">The chance you draw a number from any '+
       'of the three stacks</div>'+
       anyStackBars(st)+'</div>'+
       '<div class="hrow"><div class="hcap">Lots each number still fits '+
       '(without roundabouts)</div>'+
       spotBars()+'</div>'+
       '<div class="hrow"><div class="hcap">Which street those lots are in</div>'+
       streetMatrix()+'</div></div>'+
       '<div>';
    st.forEach((s2,i)=>{
      h+='<div class="hrow"><div class="hcap">Stack '+(i+1)+
         ': chance you draw a number ('+s2.pool+' cards left)</div>'+
         bars(s2.nums, s2.pool, (k,pool)=>k/pool)+'</div>';
    });
    h+='</div></div>';
    body.innerHTML=h;
  }
}


/* ---------------------------------------------------------------- the overlay
   One panel, on the card the turn belongs to, for every effect. It explains the
   action, holds whatever choice it needs, and ends in a single confirmation. The
   board stays live underneath: effects that need a target are picked there and
   reported back here, so the shape of a turn never changes from card to card. */
/* The card that gives the effect carries the effect's own choices, so a parameter
   is set on the card it belongs to rather than on the one holding the number. */
function effectOverlay(i){
  const o=document.createElement("div"); o.className="ovl";
  const line=(cls,html)=>{ const d=document.createElement("div"); d.className=cls;
    d.innerHTML=html; o.appendChild(d); return d; };
  const opts=()=>{ const d=document.createElement("div"); d.className="ovl-opts";
    o.appendChild(d); return d; };
  const btn=(par,label,fn,kind)=>{ const b=document.createElement("button");
    b.className="ovl-b"+(kind?" "+kind:""); b.textContent=label;
    b.onclick=fn; par.appendChild(b); return b; };
  const eff=EFFECTS[cardAt(i).e];
  line("ovl-h", eff.short);

  switch(sel.phase){
    case "temp": {
      const base=cardAt(sel.numCard).n;
      line("ovl-p","Write <b>"+base+"</b> changed by 1 or 2. Using it crosses a temp box.");
      const r=opts();
      [-2,-1,1,2].forEach(d=>{ const n=base+d;
        if(n<CFG.numMin||n>CFG.numMax) return;
        btn(r,(d>0?"+":"")+d+" \u2192 "+n,()=>setTemp(d)); });
      btn(r,"Leave it unused",declineTemp,"ghost");
      break; }
    case "place":
      line("ovl-p","Waiting on the house. "+eff.hint+".");
      break;
    case "pool": {
      const has=G.streets[sel.street].slots[sel.idx].isPool;
      line("ovl-p",has?"That house has a planned pool. Build it?"
        :"That house has no planned pool, so none can be built.");
      const r=opts();
      if(has) btn(r,"Build the pool",()=>doPool(true));
      btn(r,has?"Leave it":"Carry on",()=>doPool(false),"ghost");
      break; }
    case "park": {
      const full=allParks(sel.street);
      line("ovl-p",full?"Every park on Street "+(sel.street+1)+" is crossed already."
        :"Cross a park on Street "+(sel.street+1)+".");
      const r=opts();
      if(!full) btn(r,"Cross a park",()=>doPark(true));
      btn(r,full?"Carry on":"Leave it",()=>doPark(false),"ghost");
      break; }
    case "fence":
      line("ovl-p","Draw a fence on any dotted space, on any street.");
      btn(opts(),"Leave it unused",skipEffect,"ghost");
      break;
    case "agent":
      line("ovl-p","Choose an estate size column in Housing estate values.");
      btn(opts(),"Leave it unused",skipEffect,"ghost");
      break;
    case "bis":
      line("ovl-p","Copy a house number into an empty house beside it.");
      btn(opts(),"Leave it unused",skipEffect,"ghost");
      break;
    case "ready":
      line("ovl-p", (sel.used===false)
        ? "Not used."
        : "Applied"+(sel.at?" \u2014 "+sel.at:"")+".");
      break;
    default:
      line("ovl-p", eff.hint+".");
  }

  /* A way out of the turn from here too, since this card is where you may be
     looking. Confirming belongs to the number card, which holds the placement. */
  const foot=document.createElement("div"); foot.className="ovl-foot";
  const back=document.createElement("button");
  back.className="ovl-b ghost"; back.textContent="Take another card";
  back.onclick=backOutTurn; foot.appendChild(back);
  o.appendChild(foot);
  return o;
}

function overlayFor(i){
  if(!sel || sel.phase==="roundabout") return null;
  /* solo: the effect card hosts the effect's own choices */
  if(CFG.mode==="solo" && sel.effCard===i && sel.effCard!==sel.numCard)
    return effectOverlay(i);
  if(sel.numCard!==i) return null;
  const o=document.createElement("div"); o.className="ovl";
  const line=(cls,html)=>{ const d=document.createElement("div"); d.className=cls;
    d.innerHTML=html; o.appendChild(d); return d; };
  const opts=()=>{ const d=document.createElement("div"); d.className="ovl-opts";
    o.appendChild(d); return d; };
  const btn=(par,label,fn,kind)=>{ const b=document.createElement("button");
    b.className="ovl-b"+(kind?" "+kind:""); b.textContent=label;
    b.onclick=fn; par.appendChild(b); return b; };

  const eff = sel.eff ? EFFECTS[sel.eff] : null;
  /* In the solo variant the effect is named on its own card, so this one names the
     number instead. While the effect is still being chosen there is nothing to name
     yet, and "No effect" would read as though one had already been declined. */
  const splitHead = CFG.mode==="solo" && sel.effCard!==null &&
                    sel.effCard!==sel.numCard;
  line("ovl-h", sel.phase==="choose" ? "Choose an effect"
        : splitHead ? ("Number "+(sel.n!==null?sel.n:cardAt(sel.numCard).n))
        : (eff ? eff.short : "No effect"));

  /* In the solo variant the effect comes from a different card, so its own choices
     are made there; the number card keeps the placement and the confirmation. */
  const split = CFG.mode==="solo" && sel.effCard!==null && sel.effCard!==sel.numCard;
  const effName = eff ? eff.short : "the effect";

  switch(sel.phase){
    case "choose": {                     /* solo: the effect comes from another card */
      line("ovl-p","Number <b>"+cardAt(sel.numCard).n+"</b>. Take the effect from one "+
        "of the other two cards, or go without one.");
      const r=opts();
      btn(r,"No effect",takeNoEffect,"ghost");
      break; }
    case "temp": if(split){
      line("ovl-p","Set the shift on the <b>"+effName+"</b> card.");
      break;
    } else {
      const base=cardAt(sel.numCard).n;
      line("ovl-p","Write <b>"+base+"</b> changed by 1 or 2. Using it crosses a temp box.");
      const r=opts();
      [-2,-1,1,2].forEach(d=>{ const n=base+d;
        if(n<CFG.numMin||n>CFG.numMax) return;
        btn(r,(d>0?"+":"")+d+" \u2192 "+n,()=>setTemp(d)); });
      btn(r,"Leave it unused",declineTemp,"ghost");
      break; }
    case "place":
      line("ovl-p","Write <b>"+sel.n+"</b> in an empty house on your sheet."+
        (sel.eff==="pool"?" A blue house has a planned pool.":""));
      break;
    case "pool": if(split){
      line("ovl-p","House <b>"+sel.n+"</b> written. Decide the pool on the <b>"+effName+"</b> card.");
      break;
    } else {
      const has=G.streets[sel.street].slots[sel.idx].isPool;
      line("ovl-p",has?"That house has a planned pool. Build it?"
        :"That house has no planned pool, so none can be built.");
      const r=opts();
      if(has) btn(r,"Build the pool",()=>doPool(true));
      btn(r,has?"Leave it":"Carry on",()=>doPool(false),"ghost");
      break; }
    case "park": if(split){
      line("ovl-p","House <b>"+sel.n+"</b> written. Cross the park on the <b>"+effName+"</b> card.");
      break;
    } else {
      const full=allParks(sel.street);
      line("ovl-p",full?"Every park on Street "+(sel.street+1)+" is crossed already."
        :"Cross a park on Street "+(sel.street+1)+".");
      const r=opts();
      if(!full) btn(r,"Cross a park",()=>doPark(true));
      btn(r,full?"Carry on":"Leave it",()=>doPark(false),"ghost");
      break; }
    case "fence": if(split){
      line("ovl-p","House <b>"+sel.n+"</b> written. Draw the fence from the <b>"+effName+"</b> card.");
      break;
    }
      line("ovl-p","Draw a fence on any dotted space, on any street.");
      btn(opts(),"Leave it unused",skipEffect,"ghost");
      break;
    case "agent": if(split){
      line("ovl-p","House <b>"+sel.n+"</b> written. Choose the column from the <b>"+effName+"</b> card.");
      break;
    }
      line("ovl-p","Choose an estate size column in Housing estate values.");
      btn(opts(),"Leave it unused",skipEffect,"ghost");
      break;
    case "bis": if(split){
      line("ovl-p","House <b>"+sel.n+"</b> written. Place the bis from the <b>"+effName+"</b> card.");
      break;
    }
      line("ovl-p","Copy a house number into an empty house beside it.");
      btn(opts(),"Leave it unused",skipEffect,"ghost");
      break;
    case "ready":
      line("ovl-p", (sel.used===false || !sel.eff)
        ? "House <b>"+sel.n+"</b> written. The effect goes unused."
        : "House <b>"+sel.n+"</b> written, effect applied"+
          (sel.at?" \u2014 "+sel.at:"")+".");
      break;
  }

  const foot=document.createElement("div"); foot.className="ovl-foot";
  const back=document.createElement("button");
  back.className="ovl-b ghost"; back.textContent="Take another card";
  back.onclick=backOutTurn; foot.appendChild(back);
  const ok=document.createElement("button");
  ok.className="ovl-b go"; ok.textContent="Confirm";
  ok.disabled=!turnReady();
  ok.title=turnReady()?"End the round":"Place the house first";
  ok.onclick=confirmTurn; foot.appendChild(ok);
  o.appendChild(foot);
  return o;
}

/* The two ways to spend a round that are not a card: a permit refusal and a
   roundabout. They sit beside the combinations rather than in the bar at the foot,
   because they are alternatives to taking a card, and each carries its own
   confirmation the same way a combination does. */
function actionTiles(h){
  const col=document.createElement("div"); col.className="acts";
  col.appendChild(actTile("refusal"));
  col.appendChild(actTile("roundabout"));
  h.appendChild(col);
}
function actTile(kind){
  const busy = !!(sel && sel.phase===(kind==="refusal"?"refusing":"roundabout"));
  const other = !!(sel && !busy);
  const can = kind==="refusal"
    ? (!locked() && !mustBuild() && !sel)
    : canRoundabout();
  const d=document.createElement("div");
  d.className="act"+(busy?" busy":"")+(other?" off":"")+((!can&&!busy)?" idle":"");

  const why = kind==="refusal"
    ? (!G.started ? "Once the sheet is under way"
      : mustBuild() ? "Only when no number fits anywhere"
      : "")
    : (!CFG.roundabouts ? "Switched off in Game setup"
      : !G.started ? "Once the sheet is under way"
      : G.rounds>=CFG.roundaboutValues.length-1 ? "No roundabouts left"
      : !roundaboutSpots().length ? "Nowhere to put one"
      : "");
  if(why) d.title=why;

  const head=document.createElement("div"); head.className="act-h";
  head.innerHTML=glyph(kind==="refusal"?"refusal":"roundabout","gi")+
    '<span>'+(kind==="refusal"?"Permit refusal":"Roundabout")+'</span>';
  d.appendChild(head);

  const body=document.createElement("div"); body.className="act-p";
  if(busy){
    if(kind==="refusal"){
      const last=CFG.refusal.length-1, nth=G.refusals+1;
      const cost=CFG.refusal[Math.min(nth,last)]-CFG.refusal[Math.min(G.refusals,last)];
      /* the ladder starts free, and the last one closes the sheet */
      const what = nth>=last ? "which closes the sheet"
        : cost===0 ? "which costs nothing"
        : "costing <b>"+cost+"</b> point"+(cost===1?"":"s");
      body.innerHTML="Nothing fits. This would be refusal <b>"+nth+"</b> of "+last+
        ", "+what+".";
    } else {
      body.innerHTML="Fence on both sides and restart numbering.";
    }
  } else {
    body.innerHTML = kind==="refusal"
      ? "When no number fits, take a refusal instead."
      : (why || "Turn an empty house into a roundabout.");
  }
  d.appendChild(body);

  const foot=document.createElement("div"); foot.className="act-foot";
  const add=(label,fn,kindly)=>{ const b=document.createElement("button");
    b.className="act-b"+(kindly?" go":" ghost"); b.textContent=label;
    b.disabled=!fn; if(fn) b.onclick=fn; foot.appendChild(b); };
  if(busy){
    add("Look again", ()=>{ sel=null; render(); }, false);
    if(kind==="refusal") add("Confirm", refuse, true);
  } else {
    add(kind==="refusal"?"Take a refusal":"Place a roundabout",
        can ? (kind==="refusal"?askRefusal:beginRoundabout) : null, true);
  }
  d.appendChild(foot);
  return d;
}

function hand(){
  const h=$("hand"); h.innerHTML="";
  if(!G.started) pendingCards(h);
  else if(CFG.mode==="solo") soloCards(h);
  else comboStacks(h);
  actionTiles(h);
}

/* Before the sheet begins nothing has been dealt, so show face-down cards
   rather than three empty slots. */
function pendingCards(h){
  for(let i=0;i<3;i++){
    const d=document.createElement("div");
    d.className="combo dim";
    d.innerHTML='<div class="combo-head">'+(CFG.mode==="solo"?"Card ":"Stack ")+(i+1)+'</div>'+
      '<div class="combo-body"><div class="face'+(CFG.mode==="solo"?"":" stack")+'">'+
        '<span class="bignum">?</span></div></div>'+
      '<div class="legend"><span'+(CFG.mode==="solo"?' class="solo"':'')+'>not dealt</span></div>'+
      (CFG.mode==="solo"?"":'<div class="cornernote">&nbsp;</div>');
    /* The same button row the dealt card will have, disabled. The box was already
       a fixed height, but without this the contents sat at the top before the
       deal and jumped to the bottom the moment the sheet started. It also shows
       what the card is about to offer. */
    const p=pickRow(d);
    /* the same buttons the dealt card will have, so nothing shifts on Start: the
       solo variant asks two things of a card, the standard turn one */
    const labels = CFG.mode==="solo"
      ? ["Take this number","Take this effect"]
      : ["Take this combination"];
    labels.forEach(t=>{
      const b=document.createElement("button");
      b.textContent=t; b.disabled=true;
      p.appendChild(b);
    });
    h.appendChild(d);
  }
}

/* Solo: three cards, number side up. The corners of the number side show the
   effect on the reverse, so each card's effect is legible without turning it. */

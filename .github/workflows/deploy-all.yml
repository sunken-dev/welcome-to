name: 🚀 Orchestrated Main Deployment

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check path changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-worker-if-changed:
    needs: check-changes
    if: needs.check-changes.outputs.backend_changed == 'true'
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit

  deploy-pages-if-changed:
    needs: [check-changes, deploy-worker-if-changed]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.check-changes.outputs.frontend_changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit
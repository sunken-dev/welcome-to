name: 🚀 Deploy Backend

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment:
      name: backend
      url: https://exchange.welcome-to.sunken.dev/
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up devenv
        uses: ./.github/actions/devenv
      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: devenv shell -- npx wrangler deploy --config backend/wrangler.jsonc

name: 🚀 Deploy Frontend

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-frontend:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # frontend/ is the published root, so CNAME sits beside index.html and
      # nothing outside it -- the relay, the harness, node_modules -- is uploaded.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

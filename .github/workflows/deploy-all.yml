name: 🚀 Deploy All

# Deploys both halves by hand, in parallel, regardless of what changed.
#
# For putting the deployed state back in step with the branch: after a failed
# deploy, or after a change that CI's path filters did not consider a reason to
# deploy. Ordinary deployment is CI's job, on push.
#
# Note this runs no tests. Like the workflows it calls, it only ever deploys
# main; started from any other ref both jobs skip and the run reports success
# without having deployed anything.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-frontend:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-frontend.yml

  deploy-backend:
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

name: 🧪 Test

# Runs the harness, or one half of it, in the same devenv shell a developer
# uses, so a green run here and a green run locally mean the same thing.
#
# Called by CI with the suite for the half that changed, and available on its
# own from the Actions tab for running either half by hand.

on:
  workflow_dispatch:
    inputs:
      script:
        description: Which npm test script to run
        type: choice
        default: test
        options:
          - test
          - test:frontend
          - test:backend
  workflow_call:
    inputs:
      script:
        description: Which npm test script to run
        type: string
        default: test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up devenv
        uses: ./.github/actions/devenv
      - name: Run tests
        env:
          SCRIPT: ${{ inputs.script || 'test' }}
        run: devenv shell -- npm run "$SCRIPT"

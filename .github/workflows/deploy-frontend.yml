name: 🚀 Deploy Frontend

# Publishes the sheet to GitHub Pages.
#
# frontend/ is the published root, so CNAME sits beside index.html and nothing
# outside it -- the relay, the harness, node_modules -- is ever uploaded.
#
# Called by CI when frontend/ changed, and available on its own from the Actions
# tab. Only ever deploys main: started from any other ref the job is skipped and
# the run reports success without having published anything. Note that running
# it by hand does not run the tests first.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    environment:
      name: frontend
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

function soloCards(h){
  G.hand.forEach((c,i)=>{
    const numOn = sel && sel.numCard===i, effOn = sel && sel.effCard===i;
    const busy  = !!(sel && sel.phase!=="choose");
    const dead  = G.started && !numberUsable(c.n, tempElsewhere(i));
    const d=document.createElement("div");
    d.className="combo"+((numOn||effOn)?" chosen":"")+(busy&&!numOn&&!effOn?" dim":"")+
      (dead?" numdead":"");
    const shownN=(numOn && sel.n!==null && busy)?sel.n:c.n;
    d.innerHTML='<div class="combo-head">Card '+(i+1)+'</div>'+
      '<div class="combo-body"><div class="face">'+
        glyph(c.e,"corner tl")+
        '<span class="bignum">'+shownN+(shownN!==c.n?"*":"")+'</span>'+
        '<span class="cap2">'+EFFECTS[c.e].short+'</span>'+
        glyph(c.e,"corner br")+
      '</div></div>'+
      '<div class="legend"><span class="solo">'+
        (numOn?"used as number":(effOn?"used as effect":
          (dead?"effect only":"number \u00b7 effect")))+
      '</span></div>';
    const p=pickRow(d);
    /* Two steps, each taken on the card it belongs to: first a card for its
       number, then one of the two left for its effect. The effect is offered on
       the card that carries it, so you choose by looking at the card rather than
       by picking a name off a list. */
    const picking = !!(sel && sel.phase==="choose" && sel.numCard!==null &&
                       sel.effCard===null);
    /* Both ways to use a card, always both shown, so the pair of choices a round
       asks for is visible from the start rather than appearing a step in. */
    const bn=document.createElement("button");
    bn.textContent=dead?"No legal house":"Take this number";
    bn.className=numOn?"on":""; bn.disabled=dead||!!sel;
    bn.title=dead ? "This number will not fit anywhere on your sheet."
      : (sel ? "A number is already taken for this round" : "");
    bn.onclick=()=>chooseNumber(i);
    p.appendChild(bn);

    const be=document.createElement("button");
    be.className="oneff"+(effOn?" on":"");
    be.textContent="Take this effect";
    be.disabled=!picking||numOn;
    be.title = numOn ? "This card is giving the number"
      : picking ? EFFECTS[c.e].short+" \u2014 "+EFFECTS[c.e].hint
      : "Take a card for its number first";
    be.onclick=()=>chooseEffect(i);
    p.appendChild(be);
    const ov=overlayFor(i); if(ov) d.appendChild(ov);
    /* While an effect is being picked the other two stay live, since that is where
       the choice is made. Afterwards the one that gave the effect stays marked
       rather than shut off: it is in use, not unavailable. */
    if(sel && sel.numCard!==null && sel.numCard!==i && !picking && !effOn)
      d.classList.add("off");
    h.appendChild(d);
  });
}


/* Standard turn: each stack is two objects on the table — the card just flipped,
   lying in the discard with its effect showing, and the stack itself, whose top
   card shows the next number (and, in its corners, next round's effect). */
function comboStacks(h){
  G.shown.forEach((c,i)=>{
    const chosen = sel && sel.numCard===i;
    const busy = !!(sel && sel.phase!=="choose");
    const dead = !!c && G.started && !numberUsable(c.n, c.e==="temp");
    const d=document.createElement("div");
    d.className="combo"+(chosen?" chosen":"")+(busy&&!chosen?" dim":"")+
      (dead?" numdead dead":"");
    if(!c){
      d.innerHTML='<div class="combo-head">Stack '+(i+1)+'</div>'+
        '<div class="combo-body"><div class="face"><span class="bignum">\u2014</span></div></div>'+
        '<div class="legend"><span>stack empty</span></div>'+
        '<div class="cornernote">&nbsp;</div>';
      h.appendChild(d); return;
    }
    const shownN=(chosen && sel.n!==null && busy)?sel.n:c.n;
    d.innerHTML='<div class="combo-head">Combination '+(i+1)+'</div>'+
      '<div class="combo-body">'+
        '<div class="face discard">'+glyph(c.e,"gl")+
          '<span class="cap2">'+EFFECTS[c.e].short+'</span></div>'+
        '<span class="link">+</span>'+
        '<div class="face stack">'+
          glyph(c.nextE,"corner tl")+
          '<span class="bignum">'+shownN+(shownN!==c.n?"*":"")+'</span>'+
          glyph(c.nextE,"corner br")+
        '</div>'+
      '</div>'+
      '<div class="legend"><span>effect now</span>'+
        '<span class="mid"></span>'+
        '<span>'+G.stacks[i].length+' left</span></div>'+
      '<div class="cornernote">corners: '+EFFECTS[c.nextE].short+' next</div>';
    const p=pickRow(d);
    const b=document.createElement("button");
    b.textContent=dead?"No legal house":"Take this combination";
    b.className=chosen?"on":""; b.disabled=busy||dead||!!sel;
    if(dead) b.title="This number will not fit anywhere on your sheet.";
    b.onclick=()=>takeCombination(i);
    p.appendChild(b);
    const ov=overlayFor(i); if(ov) d.appendChild(ov);
    /* the other two take no clicks while a turn is open */
    if(sel && sel.numCard!==null && sel.numCard!==i) d.classList.add("off");
    h.appendChild(d);
  });
}

/* the spacer keeps the caption clear of the dashed rule however tall the card is */
function pickRow(d){
  const gap=document.createElement("div"); gap.className="pgap"; d.appendChild(gap);
  const p=document.createElement("div"); p.className="picks"; d.appendChild(p);
  return p;
}

function boxes(vals,crossed){
  return vals.map((v,k)=>'<span class="bx '+(k<crossed?'out':(k===crossed?'live':''))+'">'+v+'</span>').join("");
}

/* How far one press of a step button moves: three lots, or the visible width if
   that is smaller. */
function roadStep(road){
  const lot=parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue("--lot-w"))||59;
  return Math.max(40, Math.min((road.clientWidth||0)||120, (lot+2)*3));
}
/* Which edges have more street beyond them, and whether it scrolls at all.
   Called on every scroll, and once for all roads whenever the window resizes. */
function markRoad(wrap,road){
  const max=(road.scrollWidth||0)-(road.clientWidth||0);
  const at=road.scrollLeft||0;
  wrap.classList.toggle("scrolls", max>1);
  wrap.classList.toggle("more-l", max>1 && at>1);
  wrap.classList.toggle("more-r", max>1 && at<max-1);
}
let roadsWatched=false;
function watchRoad(wrap,road){
  road.addEventListener("scroll",()=>markRoad(wrap,road));
  road._mark=()=>markRoad(wrap,road);
  markRoad(wrap,road);
  /* One resize listener for the page, not one per street per render: streets()
     rebuilds these elements every round and the listeners would pile up. */
  if(!roadsWatched && typeof window!=="undefined" && window.addEventListener){
    roadsWatched=true;
    window.addEventListener("resize",()=>{
      (document.querySelectorAll(".road")||[]).forEach(r=>{ if(r._mark) r._mark(); });
    });
  }
}

function streets(){
  const h=$("streets"); h.innerHTML="";
  G.streets.forEach((st,si)=>{
    const w=document.createElement("div"); w.className="street";
    const pv=CFG.streets[si].parks;
    const head=document.createElement("div"); head.className="sh";
    head.innerHTML='<span class="nm">Street '+(si+1)+'</span>'+
      '<span class="track"><b>Parks</b>'+boxes(pv,st.parks)+'</span>';
    w.appendChild(head);
    const road=document.createElement("div"); road.className="road";
    const lots=document.createElement("div"); lots.className="lots";
    const e0=document.createElement("span"); e0.className="edge"; lots.appendChild(e0);
    st.slots.forEach((slot,i)=>{
      const legal = sel && sel.phase==="place" && canPlace(si,i,sel.n);
      const bt = sel && sel.phase==="bis" ? bisAt(si,i) : null;
      const rp = sel && sel.phase==="roundabout" && slot.v===null && !slot.round;
      const b=document.createElement("button"); b.type="button";
      /* the first and last of a locked run, so the bar can be closed at its ends */
      const prevLocked = i>0 && st.slots[i-1].locked &&
        st.slots[i-1].lockedBy===slot.lockedBy && !st.fences[i-1];
      const nextLocked = i+1<st.slots.length && st.slots[i+1].locked &&
        st.slots[i+1].lockedBy===slot.lockedBy && !st.fences[i];
      b.className="lot"+(slot.v!==null?" built":"")+
        (slot.locked?" locked lock"+(slot.lockedBy||1)+
          (prevLocked?"":" lockstart")+(nextLocked?"":" lockend"):"")+
        (slot.round?" roundabout":"")+(rp?" rndpick":"")+
        (legal?" legal":"")+(legal&&sel.eff==="pool"&&slot.isPool?" pool":"")+
        (bt?" src":"")+(G.inked===si+":"+i?" inked":"");
      b.setAttribute("aria-label","Street "+(si+1)+" house "+(i+1)+
        (slot.round?", roundabout"
          :(slot.v!==null?", "+slot.v+(slot.bis?" bis":""):", empty"))+
        (slot.isPool&&!slot.round?", planned pool":"")+
        (slot.locked?", spent on City Plan n\u00b0"+(slot.lockedBy||"?"):""));
      if(slot.locked)
        b.title="Spent on City Plan n\u00b0"+(slot.lockedBy||"?")+
          ". This estate can no longer be changed or used for another plan.";
      let inner="";
      if(slot.round) inner+='<span class="rnd"></span>';
      else if(slot.v!==null) inner+='<span class="val">'+slot.v+(slot.bis?'<sub>bis</sub>':'')+'</span>';
      else if(legal) inner+='<span class="ghost">'+sel.n+'</span>';
      else if(bt) inner+='<span class="ghost">'+bt.vals.join("/")+'</span>';
      else if(rp) inner+='<span class="rnd" style="opacity:.45"></span>';
      if(slot.isPool && !slot.round) inner+='<span class="pt'+(slot.pool?" filled":"")+'"></span>';
      b.innerHTML=inner;
      if(rp) b.onclick=()=>doRoundabout(si,i);
      else if(legal) b.onclick=()=>place(si,i);
      else if(bt) b.onclick=()=>{ if(bt.vals.length===1) doBis(si,i,bt.vals[0]);
        else { sel.phase="bis-pick"; sel.t=[si,i]; sel.opts=bt.vals; render(); } };
      lots.appendChild(b);
      if(i<st.fences.length){
        const pk = sel && sel.phase==="fence" && fenceOK(si,i);
        const g=document.createElement("button"); g.type="button";
        g.className="gap"+(st.fences[i]?" fenced":"")+(pk?" pick":"");
        g.setAttribute("aria-label","Fence between house "+(i+1)+" and "+(i+2));
        g.innerHTML='<span class="post"></span>';
        if(pk) g.onclick=()=>doFence(si,i);
        lots.appendChild(g);
      }
    });
    const e1=document.createElement("span"); e1.className="edge"; lots.appendChild(e1);
    road.appendChild(lots);
    /* the road inside a wrapper, so the fades and buttons can sit over it */
    const rw=document.createElement("div"); rw.className="roadwrap";
    rw.appendChild(road);
    ["l","r"].forEach(side=>{
      const b=document.createElement("button");
      b.className="roadstep "+side;
      b.textContent=(side==="l"?"\u2039":"\u203a");
      b.title=(side==="l"?"Earlier houses":"Later houses");
      b.setAttribute("aria-label",b.title);
      b.onclick=()=>road.scrollBy({left:(side==="l"?-1:1)*roadStep(road),behavior:"smooth"});
      rw.appendChild(b);
    });
    w.appendChild(rw);
    const hint=document.createElement("div"); hint.className="roadhint";
    hint.textContent="Scroll sideways to see the whole street";
    w.appendChild(hint);
    watchRoad(rw,road);
    h.appendChild(w);
  });
  G.inked=null;
}

function tracks(){
  const h=$("tracks"); h.innerHTML="";
  /* a label only where the panel heading does not already say it */
  const add=(l,html,off)=>{ const d=document.createElement("div");
    d.className="trow"+(off?" dim":"");
    if(off) d.title="Switched off in Game setup";
    d.innerHTML=(l?'<span class="lbl">'+l+'</span>':'')+html; h.appendChild(d); };
  add("", '<div class="bxgrid" style="grid-template-columns:repeat(2,var(--bxw))">'+
    boxes(CFG.pool,G.pools)+'</div>');

  /* One box per Temp Agency card in the deck, filled as they are hired: the
     effect is the only way to hire one, so the deck is the ceiling. Taken from
     the deck rather than fixed, so editing it in Game setup moves the track too.
     Under the multiplayer rules the track is purely a count, ranked against the
     other players at the end; the threshold is a solo-variant rule, so the mark
     for it only appears when that rule is the one in force. */
  const tmp=$("temps"); tmp.innerHTML="";
  { const d=document.createElement("div"); d.className="trow";
    const most=CFG.deck.temp.length, thresholdApplies=!MP.on;
    /* Columns that divide the track evenly, so no row is left ragged. */
    const cols=(most%3===0)?3:((most%2===0)?2:3);
    /* No numerals: every other track in the app puts points in its boxes, and a
       hired temp is worth nothing on its own. These are a tally. */
    let g="";
    for(let k=1;k<=most;k++)
      g+='<span class="bx'+(k<=G.temp?" out":(k===G.temp+1?" live":""))+
         ((thresholdApplies&&k===CFG.soloTempMin)?" goal":"")+'"></span>';
    d.innerHTML='<div class="bxgrid" title="'+G.temp+" of "+most+' temps hired"'+
      ' style="grid-template-columns:repeat('+cols+',var(--bxw))">'+g+'</div>';
    tmp.appendChild(d); }

  /* The three penalties keep their own box. Five boxes to a line at most: the bis
     ladder is ten long and a single row of them would set the width of the whole
     column, at the expense of the plans beside it. */
  const pen=$("pens"); pen.innerHTML="";
  const PEN_PER_LINE=5;
  const addPen=(l,html,off)=>{ const d=document.createElement("div");
    d.className="trow"+(off?" dim":"");
    if(off) d.title="Switched off in Game setup";
    d.innerHTML='<span class="lbl">'+l+'</span>'+html; pen.appendChild(d); };
  const penBoxes=(vals,crossed)=>
    '<div class="bxgrid" style="grid-template-columns:repeat('+
    Math.min(vals.length,PEN_PER_LINE)+',var(--bxw))">'+boxes(vals,crossed)+'</div>';
  addPen("Bis ("+G.bisCount+")", penBoxes(CFG.bis,G.bisCount));
  addPen("Roundabouts "+(CFG.roundabouts
        ? "("+G.rounds+" of "+(CFG.roundaboutValues.length-1)+")"
        : "\u2014 off"),
      penBoxes(CFG.roundaboutValues,G.rounds), !CFG.roundabouts);
  addPen("Permit refusal ("+G.refusals+" of 3)", penBoxes(CFG.refusal,G.refusals));
}

/* icon, section, points \u2014 shared so the side panel and the final scoresheet
   can never drift apart */
function scoreRows(s){
  let h="";
  s.rows.forEach(r=>{
    if(r[6]){                                 /* a heading, with its own icon */
      h+='<tr class="head'+(r[4]?" gap":"")+'">'+
         '<td class="ic">'+(r[3]?glyph(r[3],"si"):'')+'</td>'+
         '<td colspan="2">'+r[0]+'</td></tr>';
      return;
    }
    const cls=[];
    if(r[1]<0) cls.push("neg");
    if(r[5]) cls.push("dim");

    h+='<tr'+(cls.length?' class="'+cls.join(" ")+'"':'')+'>'+
       '<td class="ic">'+(r[3]?glyph(r[3],"si"):'')+'</td>'+

}

/* Both buttons say how many rounds are there to take, in a slot two digits wide so the
   bar does not shuffle as the number changes. Greyed when there is nothing to take from
   where the board stands, and while a turn is open, since the way out of an unfinished
   turn is another card rather than an undo. */
function syncUndoButtons(){
  const u=$("btn-undo"), r=$("btn-redo");
  if(!u||!r) return;
  const open=!!sel;
  const nu=undoAvailable(), nr=redoAvailable();
  const put=(b,label,n,live,why)=>{
    b.innerHTML=label+' <span class="ct">\u00b7&nbsp;'+
      (n>=10?String(n):"&nbsp;"+n)+'</span>';
    b.disabled=!live;
    b.title=live?"":why;
  };
  put(u,"Undo Round",nu, nu>0 && !open,
      open ? "Finish or leave the round first"
           : undoDepth()===0 ? "Taking rounds back is switched off for this sheet"
           : "There is nothing to take back");
  put(r,"Redo Round",nr, nr>0 && !open,
      open ? "Finish or leave the round first" : "There is nothing to put back");
}
function status(){
  const m=$("msg"), c=$("chips"); c.innerHTML="";
  syncUndoButtons();
  const chip=(t,fn,g)=>{ const b=document.createElement("button");
    b.className="chip"+(g?" ghosty":""); b.textContent=t; b.onclick=fn; c.appendChild(b); };

  if(!G.started){
    $("btn-undo").disabled=true; $("btn-redo").disabled=true;
    m.innerHTML="Sheet ready. Press <b>Start</b> to deal the first cards.";
    return;
  }
  if(mpIAmWaiting()){
    const w=mpWaitingFor();
    $("btn-undo").disabled=true; $("btn-redo").disabled=true;
    m.innerHTML="Round "+G.round+" committed. Waiting for <b>"+
      esc(w.join(", ")||"the other players")+"</b>.";
    return;
  }
  if(G.over){ m.innerHTML="Sheet closed. Final scoring <b>"+score().total+"</b>."; return; }

  if(sel && sel.phase==="roundabout"){
    m.innerHTML="<b>Roundabout</b> \u2014 click an empty house on your sheet.";
    return;
  }
  if(sel && sel.phase==="refusing"){
    m.innerHTML="<b>Permit refusal</b> \u2014 confirm it on the card, or look again.";
    return;
  }
  if(!sel || sel.phase==="choose"){
    if(!mustBuild()){
      const shift = CFG.mode==="solo"
        ? (G.hand||[]).some((c,i)=>c&&numberUsable(c.n,tempElsewhere(i)))
        : (G.shown||[]).some(c=>c&&numberUsable(c.n,c.e==="temp"));
      m.innerHTML="<span class='warn'>No number fits as it stands \u2014 take a building "+
        "permit refusal"+(shift?", or use the temp agency to shift one.":".")+"</span>";
      return;
    }
    if(CFG.mode==="solo"){
      m.innerHTML = (sel && sel.numCard!==null)
        ? "Number <b>"+cardAt(sel.numCard).n+"</b> taken. Choose the effect on the card."
        : "Take a card for its <b>number</b>.";
    } else {
      m.innerHTML="Take one of the three combinations.";
    }
    /* An achieved plan is not safe until it is claimed: nothing locks the estates
       until then, so a later fence can break one up and the plan slips away. The
       only other sign is a small button on the plan itself, which is easy to miss. */
    const ripe=G.plans.filter(p=>!p.done && matchPlan(p));
    if(ripe.length){
      m.innerHTML+=" <span class='warn'>"+
        (ripe.length===1
          ? "Plan n\u00b0"+ripe[0].n+" is ready for <b>"+
            (G.approved?ripe[0].lo:ripe[0].hi)+"</b> points. Achieve it before "+
            "anything breaks up the estates."
          : ripe.length+" plans are ready. Achieve them before anything breaks up "+
            "the estates.")+"</span>";
    }
    return;
  }

  /* The controls for a turn live in the overlay on the card now. What is left
     here is the running commentary, which is the part worth keeping in view. */
  switch(sel.phase){
    case "temp":
      m.innerHTML="<b>Temp Agency</b> \u2014 choose how far to shift the number, on the card.";
      break;
    case "place":
      m.innerHTML="Write <b>"+sel.n+"</b> in an empty house."+
        (sel.eff==="pool"?" <span class='warn'>Blue houses have a planned pool.</span>":"");
      break;
    case "pool":
      m.innerHTML="<b>Pool Manufacturer</b> \u2014 decide on the pool, on the card.";
      break;
    case "park":
      m.innerHTML="<b>Landscaper</b> \u2014 decide on the park, on the card.";
      break;
    case "fence":
      m.innerHTML="<b>Surveyor</b> \u2014 click a dotted space on any street.";
      break;
    case "agent":
      m.innerHTML="<b>Real Estate Agent</b> \u2014 click an estate size column.";
      break;
    case "bis":
      m.innerHTML="<b>Bis</b> \u2014 click an empty house beside a numbered one.";
      break;
    case "ready":
      m.innerHTML="Ready. <b>Confirm</b> on the card to end the round, or take another card.";
      break;
    case "choose":
      m.innerHTML="Choose the effect on the card, or go without one.";
      break;
  }

}

   can lay the figures out like any other panel. Clicking outside or pressing Escape
   is a no, as it is everywhere else. */
function askBox(o){

     put must not hold it open too: saying no goes back by whatever set backTo. */

     might want to do as well as changing their mind. */

/* Which panel the player is looking at. The settings arrive from storage after the
   page is already up and interactive, and restoring them deals a new sheet, which
   opens the new sheet page. Without this the player would be thrown out of whatever
   they had opened in the meantime, which is exactly what happened on the first click
   after a load. */
let openPanel=null;
function openBox(h,sticky,size){
  roomOpen=false; shareOpen=false;

  m.innerHTML=h;
  m.className = "modal" + (size===true ? " wide" : (size ? " "+size : ""));
  $("scrim").hidden=false;

}
function closeBox(){ if(boxSticky) return; $("scrim").hidden=true; }
function forceCloseBox(){ boxSticky=false; roomOpen=false; $("scrim").hidden=true; }
/* Sub-panels remember where they were opened from, so closing Theme after
   reaching it through Setup returns to Setup rather than jumping to the
   briefing. */
let backTo=null;
function backOut(){
  /* Where a visit starts there is nowhere behind it, so stay put. Reached from the
     new sheet page there is, and backTo says so. */
  if(openPanel===sheetsPanel && !backTo) return;
  const via=backTo; backTo=null;
  if(via){ via(); return; }
  if(G && !G.started) briefing(); else forceCloseBox();
}

/* ====================================================== SHARING A SETUP
   A link carries only the settings that differ from the defaults, base64url
   encoded in the fragment. The fragment is never sent to a server, so a link
   works from a static host and from file:// alike.

   Anything arriving this way is untrusted: every value is whitelisted, type
   checked and clamped before it is allowed near the game. A malformed link
   falls back to the defaults rather than producing a broken sheet.          */
/* Every setting that decides what a sheet is, and nothing that decides how it looks
   or who is playing. The theme is deliberately absent: it is a personal choice about
   appearance, and a link should not repaint someone else's screen.
   custom matters more than it looks. Without it a recipient could receive altered
   tables while their own switch was off, which would hide the very numbers their
   sheet was being scored on. */
const SHARE_KEYS=["mode","seed","advanced","roundabouts","planOff","custom",
  "hintsAllowed","undo","city",
  "streets","estate","pool","bis","refusal","roundaboutValues","tempRanks",
  "soloTempMin","soloTempPts","deck","numMin","numMax","targets"];

function b64u(str){
  const bytes=new TextEncoder().encode(str);
  let bin=""; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64u(t){
  let x=String(t).replace(/-/g,"+").replace(/_/g,"/");
  while(x.length%4) x+="=";
  const bin=atob(x), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function shareDiff(){
  const def=copy(BASE), out={};
  SHARE_KEYS.forEach(k=>{
    if(JSON.stringify(CFG[k])!==JSON.stringify(def[k])) out[k]=CFG[k];
  });
  /* A pinned seed is a setting and travels as one, through the diff above. An
     unpinned seed belongs to this sheet only, so it travels separately and does
     not become a preference at the other end \u2014 the recipient opens the same
     sheet, and their next one rolls fresh, exactly as it would here.
     The reroll count goes with it, since the three plans follow from
     seed + pool + reroll count. */
  if(G){
    if(!normalizeSeed(CFG.seed) && G.seed) out.sd=G.seed;
    if(G.planRoll) out.r=G.planRoll;
  }
  return out;
}
const SHARE_LABEL={r:"plan rerolls", sd:"sheet seed", seed:"fixed seed",
  planOff:"plan pool", roundaboutValues:"roundabouts",
  soloTempMin:"temp threshold", soloTempPts:"temp points", tempRanks:"temp ranking",
  numMin:"lowest number", numMax:"highest number",
  custom:"custom rules", hintsAllowed:"hints", city:"city name"};
function shareLink(){
  const base=String(location.href).split("#")[0];
  const d=shareDiff();
  return Object.keys(d).length ? base+"#set="+b64u(JSON.stringify(d)) : base;
}

/* ---- validation ---- */
function intIn(x,lo,hi){
  const numeric = typeof x==="number" ||
                  (typeof x==="string" && x.trim()!=="" && isFinite(Number(x)));
  if(!numeric) return null;
  const n=Math.trunc(Number(x));
  return (isFinite(n) && n>=lo && n<=hi) ? n : null;
}
function intsIn(v,lo,hi,maxLen){
  if(!Array.isArray(v) || v.length===0 || v.length>maxLen) return null;
  const out=[];
  for(const x of v){
    /* Number(null) is 0 and Number(true) is 1, so check the type first rather
       than letting a list of nulls pass as a ladder of zeroes. */
    const numeric = typeof x==="number" ||
                    (typeof x==="string" && x.trim()!=="" && isFinite(Number(x)));
    if(!numeric) return null;
    const n=Math.trunc(Number(x));
    if(!isFinite(n) || n<lo || n>hi) return null;
    out.push(n);
  }
  return out;
}
function sanitizeShared(o){
  if(!o || typeof o!=="object" || Array.isArray(o)) return null;
  const out={}, planIds=BASIC_PLANS.concat(ADV_PLANS).map(p=>p.id);

  if(o.mode==="solo"||o.mode==="standard") out.mode=o.mode;
  if(typeof o.seed==="string"){ const sd=normalizeSeed(o.seed); if(sd) out.seed=sd; }
  if(typeof o.sd==="string"){ const sd=normalizeSeed(o.sd); if(sd) out.sd=sd; }
  if(typeof o.advanced==="boolean") out.advanced=o.advanced;
  { const r=intIn(o.r,0,50); if(r) out.r=r; }
  if(typeof o.roundabouts==="boolean") out.roundabouts=o.roundabouts;
  if(typeof o.custom==="boolean") out.custom=o.custom;
  if(typeof o.hintsAllowed==="boolean") out.hintsAllowed=o.hintsAllowed;
  /* How far back a round may be taken: one of the offered stops, or everything. It has to
     be a number to count as one, or anything at all would coerce to zero and an empty
     link would arrive claiming to switch undo off. */
  if(o.undo==="all") out.undo="all";
  else if(typeof o.undo==="number" && UNDO_STOPS.indexOf(o.undo)>=0) out.undo=o.undo;
  /* the same trimming the name gets when it is typed */
  if(typeof o.city==="string"){
    const c=o.city.trim().slice(0,CITY_MAX).trim();
    if(c) out.city=c;
  }
  /* o.theme is ignored on purpose: links from an older version may carry one, and
     it should not repaint the screen of whoever opens them */

  if(o.planOff && typeof o.planOff==="object" && !Array.isArray(o.planOff)){
    const po={};
    Object.keys(o.planOff).slice(0,64).forEach(k=>{
      if(planIds.indexOf(k)>=0 && o.planOff[k]) po[k]=true;
    });
    out.planOff=po;
  }

  if(Array.isArray(o.streets) && o.streets.length===3){
    const st=[];
    for(const x of o.streets){
      if(!x || typeof x!=="object") return finish(out);
      const lots=intIn(x.lots,1,30);
      if(lots===null) return finish(out);
      const parks=intsIn(x.parks,-99,99,20);
      const pools=Array.isArray(x.pools)&&x.pools.length===0 ? []
                : intsIn(x.pools,0,lots-1,lots);
      if(!parks || !pools) return finish(out);
      st.push({lots:lots, parks:parks, pools:pools});
    }
    out.streets=st;
  }

  if(o.estate && typeof o.estate==="object" && !Array.isArray(o.estate)){
    const es={}; let ok=true;
    for(let n=1;n<=6;n++){
      const col=intsIn(o.estate[n],-99,99,12);
      if(!col){ ok=false; break; }
      es[n]=col;
    }
    if(ok) out.estate=es;
  }

  [["pool",0,999,40],["bis",0,999,40],["refusal",0,999,20],
   ["roundaboutValues",0,999,20],["tempRanks",0,999,6]].forEach(([k,lo,hi,len])=>{
    const v=intsIn(o[k],lo,hi,len); if(v) out[k]=v;
  });

  [["soloTempMin",1,40],["soloTempPts",0,99],["numMin",0,50],["numMax",1,50]].forEach(([k,lo,hi])=>{
    const n=intIn(o[k],lo,hi);
    if(n!==null) out[k]=n;
  });
  if(out.numMin!==undefined && out.numMax!==undefined && out.numMin>=out.numMax){
    delete out.numMin; delete out.numMax;
  }

  if(o.deck && typeof o.deck==="object" && !Array.isArray(o.deck)){
    const dk={}; let ok=true, total=0;
    for(const e of Object.keys(BASE.deck)){
      const v=intsIn(o.deck[e],0,50,200);
      if(!v){ ok=false; break; }
      total+=v.length; dk[e]=v;
    }
    if(ok && total>0 && total<=400) out.deck=dk;
  }

  if(o.targets && typeof o.targets==="object" && !Array.isArray(o.targets)){
    const tg={};
    Object.keys(o.targets).slice(0,6).forEach(k=>{
      const n=intIn(o.targets[k],0,999);
      if(String(k).length<=24 && n!==null) tg[String(k)]=n;
    });
    if(Object.keys(tg).length) out.targets=tg;
  }
  return finish(out);

  function finish(x){ return Object.keys(x).length?x:null; }
}

let sharedIn=false;      /* shown on the briefing for this session */
let pendingRoll=0;       /* plan rerolls to replay onto the first sheet */
let pendingSeed="";      /* a shared but unpinned seed, for the opening sheet only */
function applySharedSetup(){
  let raw="";
  try{ raw=String(location.hash||""); }catch(e){ return; }
  const m=raw.match(/[#&]set=([A-Za-z0-9\-_]+)/);
  if(!m) return;
  let clean=null;
  try{ clean=sanitizeShared(JSON.parse(unb64u(m[1]))); }catch(e){ clean=null; }
  if(!clean) return;
  pendingRoll=clean.r||0;
  pendingSeed=clean.sd||"";
  delete clean.r; delete clean.sd;   /* neither is a config key */
  /* a shared link is the shared setup, not a blend with whatever was stored */
  CFG=Object.assign(copy(BASE),clean);
  CFG.dataVersion=BASE.dataVersion;
  ensureCategories();
  sharedIn=true;
  /* No save here. The stored copy still holds the theme and the connection details
     of whoever opened this, and load() is about to take them across; writing now
     would overwrite them with the defaults before they could be read. The boot
     saves once load has settled. */
  /* drop the fragment so a later reload uses what is now stored */
  try{ history.replaceState(null,"",String(location.href).split("#")[0]); }catch(e){}
}

/* ------------------------------------------------------------------ QR
   The encoder is fetched on demand from a CDN rather than carried in the page,
   which keeps this file small. It is the only external dependency and the only
   network request the app makes, so everything else still works offline and the
   code is simply left out when the script cannot be reached.                */
const QR_CDN="https://cdn.jsdelivr.net/npm/qr-code-styling@1/lib/qr-code-styling.js";
const QR_PX=224;          /* including the margin below */
/* The quiet zone, drawn inside the image. The spec asks for four modules; this is
   nearer two, which is a deliberate trade for a tighter look. The frame around it
   shares the code's background, so a little more surround comes from there, and
   the modules themselves grow as the margin shrinks. */
const QR_MARGIN=10;
/* One place the level lives, and it is shown in the panel so it can be read off
   rather than guessed at from how dense the code looks. */
const QR_EC="M";          /* about 15% damage tolerance, the usual default */
let qrState="idle";       /* idle | loading | ready | unavailable */

function qrReady(){ return qrState==="ready" && typeof QRCodeStyling!=="undefined"; }
function qrLoad(then){
  /* The callback exists only to repaint once an asynchronous fetch settles. It
     must never fire on a path that resolves synchronously, or the caller that
     repaints on it re-enters itself without end. */
  if(typeof QRCodeStyling!=="undefined"){ qrState="ready"; return; }
  if(qrState==="loading" || qrState==="unavailable") return;
  /* no point attempting a fetch the browser already knows will fail */
  try{ if(navigator && navigator.onLine===false){ qrState="unavailable"; return; } }
  catch(e){}
  qrState="loading";
  let settled=false;
  const done=()=>{
    if(settled) return; settled=true;
    qrState=(typeof QRCodeStyling!=="undefined")?"ready":"unavailable";
    then&&then();
  };
  try{
    const sc=document.createElement("script");
    sc.src=QR_CDN; sc.async=true;
    sc.onload=done; sc.onerror=done;
    document.head.appendChild(sc);
    setTimeout(done,6000);            /* a stalled request must not hang the panel */
  }catch(e){ qrState="unavailable"; then&&then(); }
}
function qrMessage(){
  if(qrState==="loading") return "Fetching the QR code\u2026";
  return "No QR code \u2014 it needs a connection the first time. The link works either way.";
}
/* The colours come from the palette rather than a hand-picked pair: whichever of
   the theme's ink and card is darker draws the modules and the lighter one the
   background, which inverts correctly on a dark theme without special-casing it.
   A scanner needs contrast above all, so the pair is measured and falls back to
   black on white if a palette ever fails to clear the floor. */
function relLum(hex){
  const h=String(hex).replace("#","");
  if(h.length!==6) return null;
  const ch=[0,2,4].map(i=>{
    const c=parseInt(h.slice(i,i+2),16)/255;
    return (c<=0.03928)?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  });
  return 0.2126*ch[0]+0.7152*ch[1]+0.0722*ch[2];
}
function contrast(a,b){
  const la=relLum(a), lb=relLum(b);
  if(la===null||lb===null) return 0;
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05);
}
const QR_MIN_CONTRAST=7;
function qrLook(){
  const t=THEMES[CFG.theme]||THEMES.drafting;
  const v=t.vars||{};
  const ink=v["--ink"], card=v["--card"];
  let dark="#000000", light="#ffffff";
  if(relLum(ink)!==null && relLum(card)!==null && contrast(ink,card)>=QR_MIN_CONTRAST){
    const inkDarker=relLum(ink)<relLum(card);
    dark = inkDarker?ink:card;
    light= inkDarker?card:ink;
  }
  const st=t.qr||{};
  return {dark:dark, light:light,
          dots:st.dots||"square", corners:st.corners||"square",
          cornerDots:st.cornerDots||"square"};
}
function qrPaint(el,text){
  if(!el || !qrReady()) return false;
  try{
    el.innerHTML="";
    const look=qrLook();
    const code=new QRCodeStyling({
      width:QR_PX, height:QR_PX, type:"svg", data:text, margin:QR_MARGIN,
      /* The whole object, not just the level. The library's own default for
         qrOptions is Q, and passing a partial object leaves the outcome at the
         mercy of whether it merges deeply or replaces. Byte mode is what a
         base64url payload needs in any case. */
      qrOptions:{ typeNumber:0, mode:"Byte", errorCorrectionLevel:QR_EC },
      dotsOptions:{ color:look.dark, type:look.dots },
      backgroundOptions:{ color:look.light },
      cornersSquareOptions:{ color:look.dark, type:look.corners },
      cornersDotOptions:{ color:look.dark, type:look.cornerDots }
    });
    code.append(el);
    /* the build may finish a tick later, and an over-long payload can fail
       there rather than throwing here */
    setTimeout(()=>{
      if(el && !String(el.innerHTML||"").trim()){
        el.className="qrnone";
        el.textContent="That setup is too long for a QR code, so send the link.";
      }
    },0);
    return true;
  }catch(e){ return false; }        /* too long for a code, or the library changed */
}

/* What a sheet was set up to be, in one place: the new sheet page describes the one
   about to be dealt and the active sheets screen describes a stored one, and the two

   live one so a stored sheet can be described as it was played. */
function sheetRows(c, seedCell){

  try{
    return [
      ["Mode", MODE_NAMES[c.mode]||c.mode],
      ["City plans", planPool().length+" of "+activePlans().length+" in the pool"+
                     (advancedOn()?", advanced included":", standard only")+
                     (c.roundabouts?" \u00b7 roundabouts on":"")],
      ["Deck", deckTotal()+" construction cards"+
               (c.mode==="solo" ? " plus the Solo card" : ", in three stacks")],
      ["Streets", c.streets.map(x=>x.lots).join(" \u00b7 ")+" houses"],
      ["Theme", THEMES[c.theme] ? THEMES[c.theme].name
                                : THEMES[BASE.theme].name+" (its own is gone)"],
      ["Hints", c.hintsAllowed ? "available" : "not available"],
      ["Undo", undoLabel(c.undo===undefined?BASE.undo:c.undo)],
      ["Rules", (function(){
        const changed=c.custom ? customChanges() : [];
        return changed.length ? "<b>custom</b> \u2014 "+andList(changed)+" changed"
                              : "default";
      })()],
      ["Targets", Object.keys(c.targets).map(k=>k+" "+c.targets[k]+" pts").join(" \u00b7 ")],
      ["Seed", seedCell]
    ];
  } finally { CFG=savedCFG; }
}

/* ---------------------------------------------------- active sheets
   Sheets in progress, and finished ones for a week. The list on the left, everything
   known about the chosen one on the right: how it was set up, using the same
   description the new sheet page uses, and where it had got to. */
let sheetsList=[], sheetsPick=null;
/* More than one can be chosen, which is only for deleting several at once: shift for a
   run, ctrl or cmd to pick them off one by one. The anchor is where a shift range
   starts from. */
let sheetsPicked=[], sheetsAnchor=null;
/* How the list is ordered and what it leaves out. Both are choices about looking at
   the list, not about the sheets, so they are not stored. */
let sheetsSort="date", sheetsShow="all", sheetsWhen="any", sheetsName="";
const SHEET_SORTS={date:"date", name:"name", state:"state"};
const SHEET_SHOWS={all:"all", running:"in progress", finished:"finished"};
/* the same three things can be filtered on as can be sorted on: what it is called,
   when it was last played, and whether it is finished */
const SHEET_WHENS={any:"any time", today:"today", week:"this week"};

/* midnight, so "today" means today rather than the last 24 hours */
function startOfToday(){
  const d=new Date(); d.setHours(0,0,0,0); return d.getTime();
}
function sheetsInView(){
  let out=sheetsList.slice();
  if(sheetsShow==="running") out=out.filter(x=>!x.finished);
  else if(sheetsShow==="finished") out=out.filter(x=>x.finished);
  if(sheetsWhen!=="any"){
    const now=Date.now();
    const since=sheetsWhen==="today" ? startOfToday() : now-7*DAY;
    out=out.filter(x=>(x.lastPlayed||0)>=since);
  }
  const want=sheetsName.trim().toLowerCase();
  if(want) out=out.filter(x=>
    (((x.cfg&&x.cfg.city)||"").toLowerCase().indexOf(want)>=0));
  const name=x=>((x.cfg&&x.cfg.city)||"").trim().toLowerCase();
  if(sheetsSort==="name"){
    /* nameless ones last, rather than sorting under an empty string */
    out.sort((a,b)=>{
      const an=name(a), bn=name(b);
      if(!an!==!bn) return an?-1:1;
      return an.localeCompare(bn) || (b.lastPlayed||0)-(a.lastPlayed||0);
    });
  } else if(sheetsSort==="state"){
    out.sort((a,b)=>(a.finished?1:0)-(b.finished?1:0) ||
                    (b.lastPlayed||0)-(a.lastPlayed||0));
  } else {
    out.sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0));
  }
  return out;
}

function sheetWhen(ms){
  if(!ms) return "\u2014";
  const d=new Date(ms), now=new Date();
  const day=d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
  const time=d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  const sameDay=d.toDateString()===now.toDateString();
  const yesterday=new Date(now.getTime()-DAY).toDateString()===d.toDateString();
  return sameDay ? "today "+time : yesterday ? "yesterday "+time : day+" "+time;
}
/* A finished sheet is kept for a week, so say how much of it is left rather than
   letting it disappear without warning. */
function sheetDaysLeft(x){
  if(!x || !x.finished) return null;
  const used=(Date.now()-(x.lastPlayed||x.created||Date.now()))/DAY;
  return Math.max(0, Math.ceil(KEEP_FINISHED_DAYS-used));
}
function sheetGoesIn(x){
  const d=sheetDaysLeft(x);
  if(d===null) return "";
  return d<=0 ? "goes today" : d===1 ? "1 day left" : d+" days left";
}
function sheetHouses(g){
  let n=0;
  (g.streets||[]).forEach(st=>(st.slots||[]).forEach(x=>{ if(x.v!==null) n++; }));
  return n;
}
/* An unnamed sheet reads the same here as everywhere else: the masthead, the new
   sheet page and the page title all show an ellipsis for a city with no name. */
function sheetTitle(x){
  const city=((x.cfg&&x.cfg.city)||"").trim();
  return city ? esc(city) : '<span class="noname">\u2026</span>';
}



const sheetsPanel=()=>activeSheets(sheetsList);
/* Which sheets a click leaves chosen. Plain takes one, shift takes the run between it
   and the anchor as the list is currently ordered, ctrl or cmd adds or removes one. */
function pickSheet(id, ev){
  const view=sheetsInView().map(x=>x.id);
  const shift=!!(ev && ev.shiftKey);
  const meta=!!(ev && (ev.ctrlKey || ev.metaKey));
  if(shift && sheetsAnchor && view.indexOf(sheetsAnchor)>=0){
    const a=view.indexOf(sheetsAnchor), b=view.indexOf(id);
    const lo=Math.min(a,b), hi=Math.max(a,b);
    sheetsPicked=view.slice(lo,hi+1);
  } else if(meta){
    sheetsPicked = sheetsPicked.indexOf(id)>=0
      ? sheetsPicked.filter(x=>x!==id)
      : sheetsPicked.concat([id]);
    sheetsAnchor=id;
  } else {
    sheetsPicked=[id];
    sheetsAnchor=id;
  }
  /* keep them in the order they are shown, so a range reads as a range */
  sheetsPicked=view.filter(x=>sheetsPicked.indexOf(x)>=0);
  sheetsPick=sheetsPicked.length===1 ? sheetsPicked[0] : null;
}
function activeSheets(list){
  openPanel=sheetsPanel;
  sheetsList=pruneSheets(list||sheetsList);
  const empty=!sheetsList.length;
  /* the chosen one has to be one the filter is showing, or the description would
     describe a sheet that is not in the list */
  const showing=empty ? [] : sheetsInView();
  const ids=showing.map(x=>x.id);
  /* only sheets the filters are showing can be chosen, or the panel would describe
     something absent from the list */
  sheetsPicked=sheetsPicked.filter(id=>ids.indexOf(id)>=0);
  if(!empty && showing.length && !sheetsPicked.length){
    sheetsPicked=[showing[0].id]; sheetsAnchor=showing[0].id;
  }
  sheetsPick=sheetsPicked.length===1 ? sheetsPicked[0] : null;
  const many=sheetsPicked.length>1;
  const chosen=showing.filter(x=>sheetsPicked.indexOf(x.id)>=0);
  const pick=many ? null : (showing.find(x=>x.id===sheetsPick) || null);

  const view=empty ? [] : sheetsInView();
  let h='<h3>Your sheets</h3>'+
    '<p class="lede">'+(empty
      ? 'A clean desk, three empty streets and a sharpened pencil. Somebody has to '+
        'build this town.'
      : (view.length===sheetsList.length
          ? sheetsList.length+' sheet'+(sheetsList.length===1?'':'s')
          : view.length+' of '+sheetsList.length+' sheets')+
        ' waiting. Pick one up where you left it, or start something new.')+'</p>';
  /* How to look at the list, rather than anything about the sheets themselves. The row
     is drawn either way so the screen keeps its height with nothing in it. */
  if(empty) h+='<div class="sheetctls"></div>';
  if(!empty){
    h+='<div class="sheetctls">'+
       '<span class="ctlgroup"><span class="ctllabel">Sort</span>';
    Object.keys(SHEET_SORTS).forEach(k=>{
      h+='<button class="sheetctl'+(sheetsSort===k?" on":"")+'" data-sort="'+k+'">'+
         SHEET_SORTS[k]+'</button>';
    });
    h+='</span><span class="ctlgroup"><span class="ctllabel">Show</span>';
    Object.keys(SHEET_SHOWS).forEach(k=>{
      h+='<button class="sheetctl'+(sheetsShow===k?" on":"")+'" data-show="'+k+'">'+
         SHEET_SHOWS[k]+'</button>';
    });
    h+='</span><span class="ctlgroup"><span class="ctllabel">Played</span>';
    Object.keys(SHEET_WHENS).forEach(k=>{
      h+='<button class="sheetctl'+(sheetsWhen===k?" on":"")+'" data-when="'+k+'">'+
         SHEET_WHENS[k]+'</button>';
    });
    h+='</span><span class="ctlgroup grow"><span class="ctllabel">Name</span>'+
       '<input class="sheetfind" id="sheetfind" value="'+esc(sheetsName)+'"'+
       ' placeholder="any" spellcheck="false" aria-label="Filter by city name">'+
       (sheetsName?'<button class="sheetctl" id="sheetfindclear" '+
         'title="Show every name" aria-label="Clear the name filter">\u00d7</button>':'')+
       '</span></div>';
  }
  h+='<div class="sheets'+(empty?' bare':'')+'">'+
    '<div class="sheetlist" role="listbox">';
  if(!empty && !view.length){
    const why=[];
    if(sheetsShow!=="all") why.push(SHEET_SHOWS[sheetsShow]);
    if(sheetsWhen!=="any") why.push("played "+SHEET_WHENS[sheetsWhen]);
    if(sheetsName.trim()) why.push('named like \u201c'+esc(sheetsName.trim())+'\u201d');
    h+='<p class="note">No sheets '+(why.length?andList(why):"to show")+'.</p>';
  }
  view.forEach(x=>{
    const taken=sheetsPicked.indexOf(x.id)>=0;
    h+='<button class="sheetrow'+(taken?' on':'')+
       (x.finished?' done':'')+'" data-sheet="'+x.id+'" role="option"'+
       ' aria-selected="'+(taken?'true':'false')+'">'+
       '<span class="srname">'+sheetTitle(x)+'</span>'+
       '<span class="srwhen">'+sheetWhen(x.lastPlayed)+'</span>'+
       '<span class="srstate">'+(x.finished
         ? 'finished \u00b7 '+x.total+' pts \u00b7 '+sheetGoesIn(x)
         : 'round '+(x.game.round||1)+' \u00b7 '+sheetHouses(x.game)+' built')+
       '</span></button>';
  });
  h+='</div><div class="sheetfacts">';
  if(empty){
    /* An empty screen with an empty half beside it reads as something broken, so it gets
       the sheet's own emblem and a line of its own. */
    h+='<div class="nosheets">'+glyph("city","")+
       '<p>Nothing here yet.</p>'+
       '<p class="quiet">Whatever you build is kept here, so you can put a sheet down '+
       'halfway through and pick it up another day.</p></div>';
  }
  if(many){
    /* Nothing to describe when several are chosen, so the space says what they are.
       Choosing more than one is only for getting rid of them together. */
    const fin=chosen.filter(x=>x.finished).length;
    /* Rows rather than a table. A table sizes its own columns, and with a heading that
       spans both of them there was no arrangement of widths, colgroups or fixed layout
       that stopped the names being cut off at the left. A row that puts the name against
       the value has no column algorithm to fight: the value takes what it needs and the
       name takes the rest. */
    const prow=(k,v)=>'<div class="pickrow"><span class="pk">'+k+
      '</span><span class="pv">'+v+'</span></div>';
    h+='<div class="picklist">'+
       '<div class="pickhead">'+sheetsPicked.length+' sheets selected</div>'+
       prow("In progress", chosen.length-fin)+
       prow("Finished", fin)+
       prow("Oldest", sheetWhen(Math.min.apply(null, chosen.map(x=>x.lastPlayed||0))))+
       prow("Newest", sheetWhen(Math.max.apply(null, chosen.map(x=>x.lastPlayed||0))))+
       '<div class="pickhead">Which ones</div>';
    chosen.forEach(x=>{
      h+='<div class="pickrow"><span class="pk name">'+sheetTitle(x)+'</span>'+
         '<span class="pv">'+(x.finished ? 'finished \u00b7 '+x.total+' pts'
           : 'round '+(x.game.round||1))+'</span></div>';
    });
    h+='</div>';
  }
  if(pick){
    const c=Object.assign(copy(BASE), pick.cfg||{});
    const g=pick.game;
    h+='<table class="brief"><tr class="sechead"><td colspan="2">Where it stands</td></tr>';
    const state=[
      ["State", pick.finished
        ? "<b>finished</b> \u00b7 "+sheetGoesIn(pick)
        : "in progress"],
      ["Round", (g.round||1)+" of "+CITY_MAX],
      ["Built", sheetHouses(g)+" house"+(sheetHouses(g)===1?"":"s")],
      ["Score", pick.total+" points"],
      ["Time played", fmt2((pick.clock&&pick.clock.total)||0)],
      ["Started", sheetWhen(pick.created)],
      ["Last played", sheetWhen(pick.lastPlayed)]
    ];
    state.forEach(r=>{ h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
    h+='<tr class="sechead"><td colspan="2">How it was set up</td></tr>';
    sheetRows(c, esc(g.seed||"\u2014")).forEach(r=>{
      h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';
    });
    h+='</table>';
  }
  h+='</div></div>'+
     '<div class="toolbar">'+
     '<button class="btn'+((empty||many)?'':' primary')+'" id="sh-resume"'+
       (empty ? ' disabled title="There is nothing to resume yet"'
        : many ? ' disabled title="Only one sheet can be picked up at a time"' : '')+
       '>Resume this sheet</button>'+
     '<button class="btn'+(empty?' primary':'')+'" id="sh-new">Start a new sheet</button>'+
     '<button class="btn" id="sh-del"'+
       (empty?' disabled title="There is nothing to delete"':'')+
       '>'+(many?'Delete '+sheetsPicked.length:'Delete')+'</button>'+
     '</div>';
  openBox(h, true, "wide");
  $("modal").classList.add("tallpage");

  $("modal").querySelectorAll("button[data-sheet]").forEach(b=>{
    b.onclick=ev=>{ pickSheet(b.dataset.sheet, ev); activeSheets(sheetsList); };
  });
  $("modal").querySelectorAll("button[data-sort]").forEach(b=>{
    b.onclick=()=>{ sheetsSort=b.dataset.sort; activeSheets(sheetsList); };
  });
  $("modal").querySelectorAll("button[data-show]").forEach(b=>{
    b.onclick=()=>{ sheetsShow=b.dataset.show; activeSheets(sheetsList); };
  });
  $("modal").querySelectorAll("button[data-when]").forEach(b=>{
    b.onclick=()=>{ sheetsWhen=b.dataset.when; activeSheets(sheetsList); };
  });
  if($("sheetfindclear")) $("sheetfindclear").onclick=()=>{
    sheetsName=""; activeSheets(sheetsList);
  };
  if($("sheetfind")){
    $("sheetfind").oninput=()=>{
      sheetsName=$("sheetfind").value||"";
      activeSheets(sheetsList);
      /* the panel is drawn again on every keystroke, so put the cursor back where it
         was or the box would lose focus after one letter */
      const box=$("sheetfind");
      if(box && typeof box.focus==="function"){
        box.focus();
        if(typeof box.setSelectionRange==="function")
          box.setSelectionRange(box.value.length, box.value.length);
      }
    };
  }
  $("sh-resume").onclick=()=>{
    if(sheetsPicked.length!==1) return;      /* one at a time, and the button says so */
    const x=sheetsList.find(y=>y.id===sheetsPicked[0]);
    if(!x) return;
    lastWritten=null;
    if(resumeStored(x)) forceCloseBox();
  };
  $("sh-new").onclick=()=>{ forceCloseBox(); newGame(); };
  $("sh-del").onclick=()=>{
    const going=sheetsList.filter(y=>sheetsPicked.indexOf(y.id)>=0);
    if(!going.length) return;
    const one=going.length===1;
    askBox({
      title: one ? "Delete this sheet?" : "Delete these "+going.length+" sheets?",
      lede:"It cannot be brought back.",
      detail:'<table class="brief">'+
        (one
          ? '<tr><td>Sheet</td><td>'+sheetTitle(going[0])+'</td></tr>'+
            '<tr><td>Last played</td><td>'+sheetWhen(going[0].lastPlayed)+'</td></tr>'+
            '<tr><td>Where</td><td>'+(going[0].finished
              ? "finished, "+going[0].total+" points"
              : "round "+(going[0].game.round||1)+", "+
                sheetHouses(going[0].game)+" built")+'</td></tr>'
          /* name every one, so nothing goes without being seen */
          : going.map(x=>'<tr><td>'+sheetTitle(x)+'</td><td>'+
              (x.finished?"finished":"round "+(x.game.round||1))+' \u00b7 '+
              sheetWhen(x.lastPlayed)+'</td></tr>').join(""))+
        '</table>',
      yes: one ? "Delete it" : "Delete all "+going.length,
      no: one ? "Keep it" : "Keep them",
      onYes:()=>{
        const gone=going.map(x=>x.id);
        deleteSheets(gone);
        sheetsList=sheetsList.filter(y=>gone.indexOf(y.id)<0);
        sheetsPicked=[]; sheetsPick=null; sheetsAnchor=null;
        if(sheetsList.length) activeSheets(sheetsList); else { forceCloseBox(); briefing(); }
      }
    });
    /* saying no comes back to the list */
    backTo=()=>activeSheets(sheetsList);
  };
}

function briefing(){
  openPanel=briefing;
  const rows=sheetRows(CFG, '<span id="seedslot"></span>');
  if(MP.on) rows[0]=["Mode", MODE_NAMES.multiplayer];
  let h='<div class="gametitle">'+
        '<span class="briefmark">'+markSvg()+'</span>'+
        '<span class="gtwords">Welcome To <span id="briefcity"></span></span>'+
        BRIEF_LOGO+'</div>'+
    '<h3>New sheet</h3>'+
    '<p class="lede">The clock starts when you begin. Nothing is dealt until then.</p>'+
    (sharedIn?'<div class="rstatus live">These settings came from a shared link.</div>':'')+
    (CFG.custom && customChanges().length
      ? (function(){ const c=customChanges();
          return '<div class="rstatus warn">Custom rules are on and the '+
            andList(c.map(x=>x.toLowerCase()))+
            ' '+(c.length===1?"table has":"tables have")+
            ' been changed, so this sheet will not compare with one played on the '+
            'printed values. Turn them off in Setup to put the rulebook back.</div>'; })()
      : '')+
    '<table class="brief">'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join("")+
    '</table>';
  /* Two marks that cannot be mistaken for one another. Rerolling is a circle, which
     is what the seed's refresh uses too. Going back is an arrow meeting a bar, so it
     reads as returning to the start. The mirrored circle these two would naturally
     both want is the same shape twice at this size. */
  h+='<h4 class="withact">City plans on the table'+
     '<span class="headacts">'+
     '<button class="seedroll" id="rnd" title="Deal three different plans" '+
     'aria-label="Deal three different plans">\u21bb</button>'+
     '<button class="seedroll" id="rst"'+(G.planRoll?'':' disabled')+
     ' title="'+(G.planRoll
       ? "Back to the three this seed deals first"
       : "Nothing to go back to yet")+'"'+
     ' aria-label="Back to the first three plans">\u21e4</button>'+
     '</span></h4>'+
     '<table class="brief plans">'+
     G.plans.map(p=>'<tr><td>n\u00b0'+p.n+(p.sp?' \u2605':'')+
       (p.sp==="parkpoolround"?'<span class="rndmark"></span>':'')+'</td><td>'+p.text+
       '</td><td>'+p.hi+' / '+p.lo+' pts</td></tr>').join("")+'</table>';
  if(best!==null) h+='<p class="note">Your best so far: <strong>'+best+'</strong> points.</p>';
  const guest=MP.on && !mpIsHost();
  h+='<div class="toolbar"><button class="btn primary" id="go"'+(guest?' disabled':'')+'>'+
       (guest?'The host starts':'Start')+'</button>'+
     '<button class="btn" id="mysheets">Your sheets</button>'+
     '<button class="btn" id="rul">Rules</button>'+
     '<button class="btn" id="chg">Setup</button>'+
     '<button class="btn" id="shr">Share</button>'+
     '</div>';
  backTo=null;                  /* the briefing is the root of the panel stack */
  /* The same height as the sheets overview, the other page a visit can start on, so
     moving between the two does not resize the panel. Whatever the rows do not fill is
     left white. */
  openBox(h, true, "mid");     /* wide enough for the title and a full-length name */
  $("modal").classList.add("tallpage");
  renderCity();
  renderSeed();
  $("go").onclick=startGame;
  $("rnd").onclick=()=>{ redrawPlans(); briefing(); render(); };
  $("rst").onclick=()=>{ if(resetPlans()){ briefing(); render(); } };
  $("chg").onclick=setup;
  $("shr").onclick=()=>{ backTo=null; sharePanel(); };
  /* reached from here, so clicking outside the list comes back here */
  if($("mysheets")) $("mysheets").onclick=()=>{ backTo=briefing; activeSheets(sheetsList); };
  /* Another tab may have stored one since, so ask; redraw only if that changes
     whether there is anywhere to go back to. */
  loadSheets().then(l=>{
    const had=sheetsList.length>0;
    sheetsList=l;
    if(had!==(l.length>0) && openPanel===briefing) briefing();
  });
  $("rul").onclick=()=>{ backTo=briefing; rulesPanel(); };
}
/* Clicking outside a panel, or pressing Escape, does what its own Cancel does:
   go back to whatever opened it, or to the new sheet dialog if no sheet is running.
   These used to hide the panel outright, which left an empty board and no way back
   when the game had not started. */
$("scrim").addEventListener("click",e=>{ if(e.target===$("scrim")) backOut(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") backOut(); });

function result(why,s){
  let v="Keep practising";
  const t=Object.keys(CFG.targets).map(k=>[k,CFG.targets[k]]).sort((a,b)=>a[1]-b[1]);
  t.forEach(e=>{ if(s.total>=e[1]) v=e[0]; });
  const rows=scoreRows(s);
  const city=(CFG.city||"").trim();
  openBox('<h3>Final scoring</h3><p class="lede">'+
    (city?esc(city)+' \u2014 ':'')+why+'</p>'+
    '<div class="verdict">'+s.total+' pts</div>'+
    '<p class="lede">'+v+' &nbsp;\u00b7&nbsp; '+t.map(e=>e[0]+" "+e[1]).join(" / ")+
    (G.soloSeen?'':' &nbsp;\u00b7&nbsp; the Solo card never came up')+'</p>'+
    '<p class="lede">'+G.round+' rounds in '+fmt(T.total)+
    ', averaging '+fmt(avgRound())+' a round.</p>'+
    '<p class="note">Seed <strong>'+esc(G.seed)+'</strong>'+
    (G.planRoll?' with plans rerolled \u00d7'+G.planRoll:'')+
    ' \u2014 enter it on a new sheet to play this one again.</p>'+
    '<table class="sheet">'+rows+'</table>'+
    mpStandings()+
    '<div class="toolbar"><button class="btn" onclick="closeBox();newGame()">New sheet</button>'+
    '<button class="btn" onclick="closeBox()">Review the sheet</button></div>');
}

function mpStandings(){
  if(!MP.on) return "";
  const ids=Object.keys(MP.finals);
  const missing=MP.players.filter(p=>!MP.finals[p.id]).map(p=>p.name);
  if(ids.length<2){
    return '<p class="note">Waiting for '+(missing.length?esc(missing.join(", ")):"the others")+
           ' to finish before the temp agency can be ranked.</p>';
  }
  const counts=ids.map(i=>MP.finals[i].temp);
  const rows=ids.map(i=>{
    const f=MP.finals[i], tp=positionalTemp(f.temp,counts);
    return {name:f.name, temp:f.temp, tp:tp, total:f.base+tp, me:i===MP.me};
  }).sort((a,b)=>b.total-a.total);
  const top=rows[0].total;
  return '<h4>Final standings</h4><table class="sheet">'+
    rows.map(r=>'<tr'+(r.me?'':'')+'><td>'+(r.total===top?'\u2605 ':'')+esc(r.name)+
      (r.me?' (you)':'')+'<span class="mini">'+r.temp+' temps \u2192 '+r.tp+' pts</span></td>'+
      '<td>'+r.total+'</td></tr>').join("")+'</table>'+
    (missing.length?'<p class="note">Still to report: '+esc(missing.join(", "))+'.</p>':'');
}

function setup(){
  openPanel=setup;
  /* Every field here is either one number or a list of them, so say which: the
     keyboard on a phone should offer digits, and a stray letter should not be
     typeable into a scoring table at all. */
  const f=(p,l,v)=>{
    const list=String(v).indexOf(",")!==-1;
    return '<label><span class="lbl">'+l+'</span>'+
      '<input data-p="'+p+'" value="'+v+'" data-kind="'+(list?"list":"num")+'"'+
      ' inputmode="numeric" spellcheck="false"'+
      ' pattern="'+(list?"[0-9, -]*":"-?[0-9]*")+'"></label>';
  };
  let h='<h3>Game setup</h3>'+
    '<p class="lede">Modes, variants and the scoring tables.</p>';

  h+='<h4>Game mode</h4><div class="toolbar">'+
     '<button class="btn'+(CFG.mode==="standard"?" on":"")+'" data-mode="standard">'+
       MODE_NAMES.standard+'</button>'+
     '<button class="btn'+(CFG.mode==="solo"?" on":"")+'" data-mode="solo">'+
       MODE_NAMES.solo+'</button>'+
     /* Playing with someone is a third way to play, so it belongs here. No data-mode
        while it is switched off: nothing should be able to set a mode the game cannot
        deal for. */
     /* Offered only if the exchange answered. It leads to a panel saying the feature is
        still to come rather than to a game, so it is not a mode you can set. */
     '<button class="btn" id="mpmode"'+(exchangeInfo.up?''
       :' disabled title="'+(exchangeInfo.asked
           ? "The exchange is not answering just now"
           : "Still asking whether the exchange is there")+'"')+
       '>'+MODE_NAMES.multiplayer+'</button>'+
     '</div>'+
     '<p class="note">'+
     'The standard turn flips one card per stack and pairs.<br>'+
     'The solo variant draws three cards and uses one for its number and a different one '+
       'for its effect.<br>'+
     'Multiplayer is still to come.</p>'+
     '<h4>Advanced variant</h4><div class="toolbar">'+
     '<button class="btn'+(CFG.roundabouts?" on":"")+'" id="rnd2">'+
       tglLabel("Roundabouts",CFG.roundabouts)+'</button>'+
     '<button class="btn'+(advancedOn()?" on":"")+'" id="adv">'+
       tglLabel("Advanced plans",advancedOn())+'</button>'+
     '<button class="btn" id="pick">Available plans</button>'+
     '</div>'+
     '<p class="note">Roundabouts lets you replace an empty house with a Roundabout.<br>'+
     'Advanced plans adds the nine starred City Plans.</p>'+
     /* hints and taking rounds back are the same kind of thing: help available from the
        bar while you play, decided once for the sheet */
     '<h4>Advantages</h4>'+
     '<p class="note">Advantages can be used from the bar at the bottom of the foot '+
     'of the sheet.</p>'+
     '<div class="toolbar">'+
     '<button class="btn'+(CFG.hintsAllowed?" on":"")+'" id="hnt">'+
       'Hints: <span class="tgl">'+
       (CFG.hintsAllowed?"available":"not available")+'</span></button>'+
     '</div>'+
     '<p class="note">Switch this off to keep it out of reach for the whole sheet.</p>'+
     '<div class="toolbar sliderow">'+
     '<input type="range" class="slider" id="undoslider" min="0" max="'+
       (undoStops().length-1)+'" step="1" value="'+undoIndex(CFG.undo)+'"'+
       ' aria-label="How many rounds may be taken back">'+
     '<span class="slidernow" id="undonow">'+esc(undoSentence(CFG.undo))+'</span>'+
     '</div>'+
     '<p class="note">This decides how far back you may go.</p>';

  h+='<h4>Appearance</h4><div class="toolbar">'+
     '<button class="btn" id="themebtn">Theme: '+esc(THEMES[CFG.theme].name)+'</button>'+
     '</div>'+
     '<p class="note">'+THEME_NOTE+'</p>';

  h+='<h4>Custom rules</h4><div class="toolbar">'+
     '<button class="btn'+(CFG.custom?" on":"")+'" id="cus">'+
       tglLabel("Custom rules",CFG.custom)+'</button>'+
     /* Putting the tables back belongs beside the switch that governs them. There is
        nothing to put back unless something has actually been changed, and with the
        switch off the tables are the printed ones by definition. */
     '<button class="btn" id="rs"'+(tablesEdited()?''
       :' disabled title="Nothing to restore: the tables are already the printed ones"')+
       '>Restore rulebook values</button>'+
     '</div>'+
     '<p class="note">'+(CFG.custom
       ? "The scoring tables and the deck are yours to change below. Turning this off "+
         "puts the printed values back."
       : "The scoring tables and the deck are the printed ones. Turn this on to change "+
         "them.")+'</p>';

  /* Everything below is the printed rulebook. It stays out of the way unless asked
     for, so a sheet cannot end up running on numbers nobody meant to change. */
  if(CFG.custom){
  h+='<h4>Streets and parks</h4>';
  CFG.streets.forEach((s,i)=>{
    h+='<div class="substack"><span class="subh">Street '+(i+1)+'</span>'+
       '<div class="fieldgrid">'+
         f("streets."+i+".lots","Houses",s.lots)+
         f("streets."+i+".pools","Planned pools",s.pools.join(","))+
         f("streets."+i+".parks","Parks",s.parks.join(","))+
       '</div></div>';
  });
  h+='<p class="note">Planned pools are box positions along the street, counted from zero.</p>';
  h+='<h4>Real estate</h4><div class="fieldgrid">';
  for(let n=1;n<=6;n++) h+=f("estate."+n,"Estate of "+n,CFG.estate[n].join(","));
  h+='</div>';

  h+='<h4>Other bonuses</h4><div class="fieldgrid">'+
       f("pool","Pools",CFG.pool.join(","))+
       f("soloTempMin","Temps for 7 pts, solo",CFG.soloTempMin)+
       f("tempRanks","Temp ranking, multiplayer",CFG.tempRanks.join(","))+
     '</div>';

  h+='<h4>Penalties</h4><div class="fieldgrid">'+
       f("bis","Bis",CFG.bis.join(","))+
       f("roundaboutValues","Roundabouts",CFG.roundaboutValues.join(","))+
       f("refusal","Building permit refusal",CFG.refusal.join(","))+
     '</div>';

  h+='<h4 id="deckhead">Construction deck</h4>'+
     '<p class="note">The number printed on the back of each effect card.</p>'+
     '<div class="fieldgrid wide">';
  Object.keys(CFG.deck).forEach(e=>{
    h+='<label><span class="lbl" id="dl-'+e+'"></span>'+
       '<input data-p="deck.'+e+'" id="di-'+e+'" value="'+
       esc(CFG.deck[e].join(","))+'" data-kind="list" inputmode="numeric"'+
       ' pattern="[0-9, -]*" spellcheck="false"></label>';
  });
  h+='</div>';
  }   /* end of the custom tables */

  h+='<div class="toolbar"><button class="btn" id="ap">Save and start new sheet</button>'+
     '<button class="btn" id="sh">Share</button>'+
     '<button class="btn" onclick="backOut()">Cancel</button></div>';

  openBox(h, false, "mid");
  /* Keep the fields to digits as they are typed, and let the restore button follow
     the form rather than waiting for a save: a single changed character is enough to
     have something to put back. */
  const clean=inp=>{
    const list=inp.dataset.kind!=="num";
    const before=inp.value;
    const after=list ? before.replace(/[^0-9,\s-]/g,"")
                     : before.replace(/[^0-9-]/g,"");
    if(after!==before) inp.value=after;
  };
  const fields=()=>$("modal").querySelectorAll("input[data-p]");
  const formEdited=()=>{
    let changed=false;
    fields().forEach(inp=>{
      const printed=basePrinted(inp.dataset.p);
      if(printed===null) return;
      if(String(inp.value).replace(/\s+/g,"")!==String(printed).replace(/\s+/g,""))
        changed=true;
    });
    return changed;
  };
  const syncRestore=()=>{
    const b=$("rs");
    if(!b) return;
    const live=formEdited()||tablesEdited();
    b.disabled=!live;
    b.title=live?"":"Nothing to restore: the tables are already the printed ones";
  };
  fields().forEach(inp=>{
    inp.oninput=()=>{
      clean(inp);
      if(/^deck\./.test(inp.dataset.p)) refreshDeckCounts();
      syncRestore();
    };
  });
  syncRestore();      /* so the button and the markup cannot disagree on opening */
  refreshDeckCounts();          /* fills the heading and every label */
  if($("mpmode")) $("mpmode").onclick=()=>{ backTo=setup; exchangePanel(); };
  $("modal").querySelectorAll("button[data-mode]").forEach(b=>{
    if(b.dataset.mode==="multiplayer"){ b.onclick=()=>{ backTo=setup; exchangePanel(); }; return; }
    b.onclick=()=>{
      if(CFG.mode===b.dataset.mode) return;
      CFG.mode=b.dataset.mode;
      save();
      /* The deck is dealt by mode, so the sheet has to be dealt again for the choice
         to mean anything. Setup stays open over it: nothing here commits until Save
         and start new sheet. */
      newGame();
      setup();
    };
  });
  $("adv").onclick=()=>{ setAdvanced(!advancedOn());
    if(G && !G.started){ setup(); render(); } else { closeBox(); newGame(); } };
  $("pick").onclick=()=>{ backTo=setup; plansPanel(); };
  $("rnd2").onclick=()=>{ CFG.roundabouts=!CFG.roundabouts; ensureCategories(); reconcilePlans();
    save(); if(G && !G.started){ setup(); render(); } else { closeBox(); newGame(); } };
  /* Off means the printed rules, always: leaving edited tables in force while
     hiding them would run the sheet on numbers you cannot see. */
  $("cus").onclick=()=>{
    const flip=()=>{
      CFG.custom=!CFG.custom;
      if(!CFG.custom) restoreTables();
      save();
      if(G && !G.started){ setup(); render(); } else { closeBox(); newGame(); }
    };
    if(CFG.custom && tablesEdited()){
      const changed=customChanges();
      backTo=setup;                 /* saying no comes back here */
      askBox({
        title:"Turn off custom rules?",
        lede:"The tables you changed go back to the printed values.",
        detail:'<table class="brief"><tr><td>Changed</td><td>'+
          andList(changed)+'</td></tr></table>',
        yes:"Restore the printed values",
        no:"Keep my changes",
        onYes:flip
      });
      return;
    }
    flip();
  };
  if($("undoslider")) $("undoslider").oninput=()=>{
    const at=Math.max(0, Math.min(undoStops().length-1, $("undoslider").value|0));
    CFG.undo=undoStops()[at];
    if($("undonow")) $("undonow").textContent=undoSentence(CFG.undo);
    save();
    syncUndoButtons();
  };
  $("hnt").onclick=()=>{
    CFG.hintsAllowed=!CFG.hintsAllowed;
    /* leaving it on while unreachable would show the panel again the moment hints
       came back, which is not what turning them off means */
    if(!CFG.hintsAllowed) CFG.hints=false;
    save(); syncHintsButton();
    if(G && !G.started){ setup(); render(); } else { closeBox(); render(); }
  };
  $("themebtn").onclick=()=>{ backTo=setup; themePicker(); };
  $("sh").onclick=()=>{ backTo=setup; sharePanel(); };
  $("ap").onclick=()=>{
    const next=copy(CFG);
    $("modal").querySelectorAll("input[data-p]").forEach(inp=>{
      const parts=inp.dataset.p.split("."), raw=inp.value.trim();
      const val = raw.indexOf(",")!==-1
        ? raw.split(",").map(x=>parseInt(x,10)).filter(x=>!isNaN(x))
        : (isNaN(parseInt(raw,10))?raw:parseInt(raw,10));
      let node=next;
      for(let i=0;i<parts.length-1;i++) node=node[parts[i]];
      const k=parts[parts.length-1];
      node[k]=(Array.isArray(node[k])&&!Array.isArray(val))?[val]:val;
    });
    CFG=next; save(); closeBox(); newGame();
  };
  /* Put the values back and stay put: it is one change among the several this screen
     offers, and nothing here is settled until Save and start new sheet.

     The guard has to be the same condition that lights the button up. Typing into a
     field does not touch the settings, so a guard that only looked at the settings
     would refuse the click on a button it had just enabled. */
  $("rs").onclick=()=>{
    if(!formEdited() && !tablesEdited()) return;
    restoreTables();
    save();
    setup();          /* redraws the fields from the printed values */
  };
}

$("btn-undo").onclick=undoRound;
$("btn-redo").onclick=redoRound;
$("btn-rules").onclick=rulesPanel;
$("btn-hints").onclick=()=>{
  if(!CFG.hintsAllowed) return;
  CFG.hints=!CFG.hints;
  syncHintsButton();
  save(); render();
};
/* With hints switched off for the sheet the button stays where it is and goes dead,
   rather than leaving a gap in the bar and moving everything along. */
function syncHintsButton(){
  const b=$("btn-hints");
  if(!b) return;
  b.disabled=!CFG.hintsAllowed;
  b.title=CFG.hintsAllowed ? "" : "Hints are switched off for this sheet in Setup";
  b.innerHTML=tglLabel("Hints",CFG.hintsAllowed && CFG.hints);
}
$("btn-theme").onclick=()=>{ backTo=null; themePicker(); };
$("btn-new").onclick=()=>{
  /* Any sheet under way is worth asking about, even before the first house goes in:
     it is saved between visits now, so starting a new one throws away something
     that would otherwise have been waiting. A finished sheet has nothing to lose. */
  if(!(G.started && !G.over)){ newGame(); return; }
  const n=houses();
  const mine=G.id;
  askBox({
    title:"Start a new sheet?",
    lede:"The sheet in progress is kept with your others unless you throw it away.",
    detail:'<table class="brief">'+
      '<tr><td>Round</td><td>'+G.round+' of '+CITY_MAX+'</td></tr>'+
      '<tr><td>Built</td><td>'+n+' house'+(n===1?'':'s')+'</td></tr>'+
      '<tr><td>Score</td><td>'+score().total+' points</td></tr>'+
      '</table>',
    /* Throwing it away is the destructive one, so it is not the primary action even
       though it is named first. */
    alt:"Discard and start new",
    onAlt:()=>{ if(mine) deleteSheet(mine); lastWritten=null; newGame(); },
    yes:"Save and start new",
    /* it is already written down; this just stops the next save overwriting it */
    onYes:()=>{ lastWritten=null; newGame(); },
    no:"Keep playing"
  });
};

applySharedSetup();     /* a link overrides the defaults before anything is dealt */
applyTheme(CFG.theme);
syncHintsButton();      /* the bar shows a Hints button only if hints are allowed */
renderCity();
newGame();
setInterval(tickClock, 500);
/* Settings first, then the sheet. A shared link is a deliberate request for those
   settings, so it deals fresh rather than resuming. */
askExchange().then(()=>{ if(openPanel===setup) setup(); });
load().then(()=>{
  /* a link arriving is worth storing, but only once their own choices have been
     merged back in by load */
  if(sharedIn){ save(); return; }
  return offerSheets();
});
</script>
